# 로봇 철민 (the corner robot) — what it says, shown by assets/js/robot.js.
#
# It talks like 철민 in a casual chat (해요체, short sentences), in the first
# person. Personal small talk only uses things already written in the
# Pensées posts; course facts come from the study notes.
#
# One block per course slug (same slugs as _data/study_courses.yml) plus
# "default" for every other page:
#   greeting   first line when the bubble opens
#   ask        (optional) line shown above the question list
#   questions  the 질문하기 menu: q (button), a (answer), optional link/link_label
#   talk       the 대화하기 pool; one line at random, no repeats until it runs out
# Links are site paths without the baseurl. {concepts} {practices} {codes}
# {heavy} are filled from the course's numbers, {courses} {notes} from the site.

default:
  greeting: "안녕하세요, 철민이에요. 정확히는 로봇 철민이요. 편하게 눌러 보세요."
  questions:
    - q: 여긴 뭐 하는 곳이에요?
      a: "제가 만든 것, 공부한 것, 묵상한 글을 모아 둔 곳이에요. 위 메뉴에서 골라서 보시면 돼요."
    - q: 어디부터 보면 좋아요?
      a: "공부 노트가 궁금하면 지식 DB부터 보세요. {courses}과목에 노트가 {notes}편 있어요. 과목 페이지로 가면 그 과목 얘기도 해 드릴게요."
      link: /studies/
      link_label: 지식 DB
    - q: 로고는 무슨 뜻이에요?
      a: "기둥 두 개 사이에 빨간 점 있죠? H랑 I 사이의 하이픈이에요. Hong-Iron. 마우스 올려 보면 점이 폴짝 뛰어요."
    - q: 배경에서 움직이는 건 뭐예요?
      a: "과목마다 달라요. 알고리즘 노트는 내릴수록 막대가 정렬되고, 확률과 통계는 공이 떨어져서 종 모양이 돼요. 한번 내려 보세요."
      link: /studies/
      link_label: 과목 둘러보기
    - q: 진짜 철민이에요?
      a: "반만요. 제 얼굴을 한 칸씩 찍어서 만든 로봇이라, 정해진 말만 할 줄 알아요. 아무 질문에나 대답은 못 해도, 과목마다 할 얘기는 좀 외워 놨어요."
  talk:
    - text: "말투가 좀 딱딱하면 이해해 주세요. 한국에 온 지 4년 가까이 됐는데, 아직 문어체가 입에 붙어 있어요."
      link: /pensees/2026/09/18/loosening-my-grip/
      link_label: 힘을 빼 보려고
    - text: "펜타 치즈 와퍼에 패티 추가해서 드셔 보세요. 진짜 하나님 일찍 만나는 맛이에요."
    - text: "폴 바셋이 타르트 맛집인 거 알고 계셨어요? 2년 전쯤 먹었던 게 생각나서 다시 사 먹어 봤어요."
    - text: "여름에 서초구에서 일할 때 퇴근길 지하철 줄이 제일 무서웠어요. 그래서 사람 빠질 때까지 회사 근처에서 저녁 먹고 들어갔어요."
      link: /pensees/2026/08/01/no-time-to-think/
      link_label: 생각할 겨를이 없는 편이 좋다
    - text: "마인크래프트 하면 고등학교 때 친구들이랑 웃고 떠들던 게 생각나요. 약속을 몇 번이나 미뤄도 또 불러 주는 친구들이에요."
    - text: "파스칼의 팡세를 샀어요. '팡세'라는 단어는 참 좋아하는데, 이 책이 걸작인지는 아직 고민 중이에요."
    - text: "잠이 안 오는 밤엔 펜을 들고 생각을 쏟아내요. 그렇게 쓴 글들이 나의 팡세에 모여 있어요."
      link: /pensees/
      link_label: 나의 팡세
    - text: "홈 화면 끝까지 내려 보셨어요? 나의 팡세에 닿으면 밤이 와요."
    - text: "확인 문제는 답 가리고 먼저 풀어 보세요. 틀려도 괜찮아요."
    - text: "공부 노트는 전부 Obsidian으로 정리한 거예요. 교재나 강의 자료는 안 올렸어요."

abnormal-psychology:
  greeting: "이상 심리학이에요. 이번 학기에 듣고 있는 수업인데, 개념만 {concepts}개를 정리했어요."
  questions:
    - q: 뭐부터 보면 돼요?
      a: "강의 순서대로 보시면 돼요. 1회에서 '이상행동의 기준'이랑 DSM부터 잡고, 2회 조현병부터 12회 성격장애까지 쭉 가요. 장애 문서 대부분이 DSM 문서를 깔고 있어서 1회는 꼭 보고 가세요."
      link: /studies/abnormal-psychology/
      link_label: 로드맵
    - q: 어려워요?
      a: "수식은 거의 없어요. 대신 비슷한 장애끼리 기간, 증상 개수, 배제 조건으로 갈려서 헷갈려요. 그래서 '○○와 ○○ 비교' 문서를 따로 만들어 뒀어요."
    - q: 배워서 어디에 써요?
      a: "주변 사람 이해할 때 진짜 많이 써요. 자살 생각을 직접 물어보는 건 생각을 심는 게 아니라 털어놓을 틈을 주는 거래요. 조현병 환자 대부분이 폭력적이지 않다는 것도 여기서 알았어요."
      link: /studies/abnormal-psychology/suicide/
      link_label: 자살
    - q: 제일 중요한 건 뭐예요?
      a: "'정신장애와 DSM'이요. 문서 17개가 이걸 깔고 있어요. 치료 쪽은 인지행동치료가 20개 넘는 문서에, 노출치료가 10개 넘는 문서에 계속 나와요."
      link: /studies/abnormal-psychology/mental-disorder-dsm/
      link_label: 정신장애와 DSM
    - q: 다른 과목이랑도 이어져요?
      a: "확률과 통계랑 이어져요. '통계적으로 드물면 이상'이라고 할 때 그 기준선이 정규분포 꼬리예요. 평균에서 표준편차 2개 아래면 2.3%쯤이요. 도박사의 오류도 확률의 독립 얘기고요."
      link: /studies/abnormal-psychology/statistical-deviation--normal-distribution/
      link_label: 통계적 일탈 ↔ 정규분포
  talk:
    - text: "이 수업 들으면서 제 지난 1년이 좀 설명되더라고요. 그 얘기는 Tenacity라는 글에 써 뒀어요."
      link: /pensees/2026/09/30/tenacity/
      link_label: Tenacity
    - text: "'드물면 이상'이라고들 많이 생각하잖아요. 근데 IQ 145도 드물지만 장애는 아니에요. 드문 거랑 이상한 건 다른 얘기예요."
      link: /studies/abnormal-psychology/abnormality-criteria/
      link_label: 이상행동의 기준
    - text: "'부적 강화'를 처벌로 아는 분이 많아요. 사실은 불쾌한 걸 없애 줘서 행동이 느는 거예요. 두통약 먹는 습관이 그래요."
      link: /studies/abnormal-psychology/behavioral-perspective/
      link_label: 행동주의적 입장
    - text: "조현병은 인격이 쪼개지는 병이 아니에요. 그건 해리성 정체감 장애고, 조현병은 망상이랑 환각으로 현실 감각이 무너지는 쪽이에요."
      link: /studies/abnormal-psychology/psychotic-symptoms/
      link_label: 정신병적 증상
    - text: "우울한 사람한테 '마음먹기 나름'이라는 말은 하지 말아 주세요. 의욕이 없는 것 자체가 증상이라 죄책감만 커져요."
      link: /studies/abnormal-psychology/major-depressive-disorder/
      link_label: 주요우울장애
    - text: "인지치료가 '긍정적으로 생각해'는 아니에요. 증거를 따져서 현실적으로 보는 거예요. 잘한 점이랑 고칠 점을 같이요."
      link: /studies/abnormal-psychology/beck-cognitive-theory/
      link_label: 우울증의 인지이론
    - text: "공황발작이 와도 심장이 위험한 건 아니래요. 경보가 잘못 울린 거라 몇 분이면 가라앉아요. 그래도 처음이면 병원에서 몸부터 확인하는 게 맞고요."
      link: /studies/abnormal-psychology/panic-disorder/
      link_label: 공황장애
    - text: "정리 좋아하는 사람한테 '강박 있다'고 하잖아요. 근데 즐기면서 하는 건 강박이 아니에요. 원치 않는 불안 때문에 억지로 반복하는 게 강박이에요."
      link: /studies/abnormal-psychology/ocd/
      link_label: 강박장애
    - text: "끔찍한 일을 겪어도 대부분은 PTSD까지 가진 않아요. 참전 군인도 15.2%, 9.11 근처 주민도 20% 정도였대요."
      link: /studies/abnormal-psychology/ptsd/
      link_label: 외상 후 스트레스 장애
    - text: "ADHD 약이 각성제라 더 날뛸 것 같죠? 오히려 행동을 억제하는 뇌 기능을 도와줘서 차분해져요."
      link: /studies/abnormal-psychology/adhd/
      link_label: ADHD

computer-communication:
  greeting: "컴퓨터 통신이에요. 이번 학기 수업이에요. 링크 한 가닥에서 시작해서 인터넷까지 쌓아 올리는 과목이에요."
  questions:
    - q: 뭐부터 보면 돼요?
      a: "1회 '점대점 링크'부터요. 링크, 스위칭 네트워크, 인터네트워크, 계층이랑 프로토콜, 데이터 링크 순서로 한 층씩 올라가요."
      link: /studies/computer-communication/
      link_label: 로드맵
    - q: 어려워요?
      a: "개념은 쉬운데 계산에서 많이 막혀요. 선에 싣는 시간(L/R)이랑 신호가 건너가는 시간(거리/속도)만 안 섞으면 돼요. 무거운 건 패킷 스위칭, 통계적 다중화, 소요시간 분석 세 개예요."
      link: /studies/computer-communication/timing-analysis/
      link_label: 소요시간 분석
    - q: 배워서 어디에 써요?
      a: "인터넷이 딱 이렇게 돌아가요. 파일을 패킷으로 쪼개면 왜 더 빨리 가는지, 회선 속도를 올려도 왜 지연은 그대로인지 계산으로 보여 줄 수 있어요."
      link: /studies/computer-communication/packet-switching/
      link_label: 패킷 스위칭
    - q: 제일 중요한 건 뭐예요?
      a: "'전송 속도와 대역폭'이요. 문서 10개가 이걸 깔고 있어요."
      link: /studies/computer-communication/rate-and-bandwidth/
      link_label: 전송 속도와 대역폭
    - q: 다른 과목이랑도 이어져요?
      a: "수학이 꽤 나와요. 동시 사용자 수는 이항분포고, 주파수 나누기는 삼각함수 곱셈이고, 다 직접 잇는 링크 수 n(n−1)/2는 조합이에요."
  talk:
    - text: "'직접 링크'랑 '점대점 링크'는 다른 말이에요. 중간에 중계하는 게 없으면 직접, 끝이 딱 둘이면 점대점이에요."
      link: /studies/computer-communication/point-to-point-link/
      link_label: 점대점 링크
    - text: "인터넷 속도가 빨라져도 신호가 더 빨리 달리는 건 아니에요. 싣는 속도가 빨라지는 거라, 400 km 건너는 2 ms는 그대로예요."
      link: /studies/computer-communication/rate-and-bandwidth/
      link_label: 전송 속도와 대역폭
    - text: "회선을 잡는다고 전선 한 가닥을 통째로 쓰는 게 아니에요. 1.536 Mbps 링크 하나에 64 kbps 회선 24개가 같이 지나가요."
      link: /studies/computer-communication/circuit-switching/
      link_label: 회선 스위칭
    - text: "스위치는 패킷 앞부분이 오자마자 넘기지 않아요. 다 받고 나서 보내요. 그래서 링크마다 L/R이 붙어요."
      link: /studies/computer-communication/packet-switching/
      link_label: 패킷 스위칭
    - text: "시분할 다중화는 칸 순서가 정해져 있어서 주소를 안 붙여요. 주소 붙이는 건 통계적 다중화예요."
      link: /studies/computer-communication/time-division-multiplexing/
      link_label: 시분할 다중화
    - text: "통계적 다중화가 늘 좋은 건 아니에요. 다들 꽉 채워 보내면 이득은 없고 주소만큼 손해예요."
      link: /studies/computer-communication/statistical-multiplexing/
      link_label: 통계적 다중화
    - text: "TCP랑 UDP는 생긴 건 비슷한데 하는 일이 달라요. TCP는 잃어버린 걸 다시 보내고, UDP는 그냥 가요."
      link: /studies/computer-communication/encapsulation/
      link_label: 캡슐화
    - text: "파일을 패킷으로 나누면 스위치가 패킷 하나씩 넘겨요. 계산해 보면 10,704 ms가 5,105 ms로 절반쯤 줄어요."
      link: /studies/computer-communication/timing-analysis/
      link_label: 소요시간 분석
    - text: "기기 여러 대가 선 하나에 붙어 있어도 직접 연결이에요. 선은 그냥 매체고, 중계하는 노드가 없으니까요."
      link: /studies/computer-communication/multiple-access-link/
      link_label: 다중 접근 링크
    - text: "다중화한다고 조각마다 이름표가 필요한 건 아니에요. 시분할은 칸 순서, 주파수 분할은 대역이 곧 이름표예요."
      link: /studies/computer-communication/multiplexing/
      link_label: 다중화

human-interface-media:
  greeting: "휴먼 인터페이스 미디어예요. 이번 학기 수업이에요. 눈이랑 뇌가 빛을 어떻게 신호로 바꾸는지 배워요."
  questions:
    - q: 뭐부터 보면 돼요?
      a: "지각, 뉴런, 뉴런 모형, 빛이랑 눈, 색 순서로 보시면 돼요. 마지막이 삼색 이론이랑 반대색 과정이에요."
      link: /studies/human-interface-media/
      link_label: 로드맵
    - q: 어려워요?
      a: "강의 소개에 미적분, 확률통계, 푸리에, C/C++를 미리 알아야 한다고 나와요. 수업에선 따로 안 가르쳐 준대요. 행렬도 꽤 나와요."
    - q: 배워서 어디에 써요?
      a: "모니터랑 카메라가 R, G, B 세 개뿐인 이유가 삼색 이론이에요. 세 개면 사람 눈엔 충분하거든요. 측면 억제는 우리가 밝기보다 경계를 더 잘 보는 이유고요."
      link: /studies/human-interface-media/trichromatic-theory/
      link_label: 삼색 이론
    - q: 제일 중요한 건 뭐예요?
      a: "'흥분성과 억제성 시냅스'랑 '뉴런과 신호 전달'이요. 뒤에 나오는 문서들이 이걸 많이 깔고 있어요."
      link: /studies/human-interface-media/excitatory-inhibitory/
      link_label: 흥분성과 억제성 시냅스
    - q: 다른 과목이랑도 이어져요?
      a: "선형대수랑 많이 겹쳐요. 뉴런 층은 o = Ax + b, 퍼셉트론은 wᵀx + b, 조건등색은 영공간 문제예요. 컴퓨터 통신이랑은 같은 전자기파의 다른 구간을 써요."
  talk:
    - text: "눈은 카메라처럼 그대로 찍는 게 아니에요. 헤르만 격자 보면 없는 회색 점이 보이잖아요. 망막에서부터 이미 가공하고 있다는 거예요."
      link: /studies/human-interface-media/perception/
      link_label: 지각
    - text: "신경 신호는 생각보다 느려요. 초속 1~120 m 정도라, 눈에서 손가락까지 0.2초 안팎이 걸려요."
      link: /studies/human-interface-media/neuron-signaling/
      link_label: 뉴런과 신호 전달
    - text: "자극이 세다고 스파이크가 커지진 않아요. 크기는 늘 같고, 얼마나 자주 튀느냐로 세기를 전해요."
      link: /studies/human-interface-media/rate-coding/
      link_label: 발화율 부호화
    - text: "퍼셉트론 하나로는 XOR을 절대 못 맞혀요. 오래 돌린다고 되는 게 아니라 답이 아예 없어요."
      link: /studies/human-interface-media/perceptron/
      link_label: 퍼셉트론
    - text: "모니터의 노란색은 노란 빛이 아니에요. 빨강이랑 초록을 같이 켠 거예요. 돋보기로 보면 바로 보여요."
      link: /studies/human-interface-media/trichromatic-theory/
      link_label: 삼색 이론
    - text: "똑같은 색으로 보여도 같은 빛이 아닐 수 있어요. 580 nm 하나랑 530, 620 nm를 섞은 빛이 둘 다 노랑이거든요."
      link: /studies/human-interface-media/metamerism/
      link_label: 조건등색
    - text: "마하 띠라는 게 있는데, 그림에 진짜 그려진 띠가 아니에요. 눈이 경계를 부풀려서 보이는 거라 옆 줄을 가리면 사라져요."
      link: /studies/human-interface-media/lateral-inhibition/
      link_label: 측면 억제
    - text: "맹점이 있는데도 시야에 구멍이 안 보이는 건, 두 눈이 서로 채워 주고 뇌가 주변 무늬로 메워서예요."
      link: /studies/human-interface-media/eye-anatomy/
      link_label: 눈의 구조
    - text: "마젠타는 무지개에 없는 색이에요. 빨강이랑 파랑을 섞어야만 보여요."
      link: /studies/human-interface-media/wave-and-light/
      link_label: 파동과 빛
    - text: "한 눈을 감아도 깊이는 꽤 알아요. 가림, 크기, 원근 같은 단서가 있거든요. 바늘귀 꿰기는 확 어려워지지만요."
      link: /studies/human-interface-media/binocular-disparity/
      link_label: 양안 시차

college-math:
  greeting: "대학수학이에요. 혼자 공부하면서 정리한 공학수학 첫 과목이에요."
  questions:
    - q: 뭐부터 보면 돼요?
      a: "함수, 지수와 로그, 삼각함수, 평면과 복소수, 수열과 합 순서예요. 선수 과목 없이 바로 시작하면 돼요."
      link: /studies/college-math/
      link_label: 로드맵
    - q: 어려워요?
      a: "공학수학 중엔 제일 짧고 가벼운 편이에요. 대신 지수함수, 로그, 삼각함수, 항등식, 오일러 공식은 확실히 잡고 가세요."
    - q: 배워서 어디에 써요?
      a: "알고리즘 시간 어림할 때 바로 써요. 2ⁿ가지를 초당 10⁹개씩 봐도 n = 50이면 13일쯤 걸려요. 이진 탐색은 10억 개라도 30번이면 끝나고요."
      link: /studies/college-math/logarithm/
      link_label: 로그
    - q: 제일 중요한 건 뭐예요?
      a: "'함수'랑 '삼각함수'요. 둘 다 뒤에 문서 다섯 개씩 걸려 있어요. 로그는 다른 과목에서 진짜 자주 불려 나와요."
      link: /studies/college-math/function/
      link_label: 함수
    - q: 다른 과목이랑도 이어져요?
      a: "덧셈정리, 복소수 곱, 회전 행렬이 사실 같은 얘기예요. 각을 더하면 회전이 합쳐진다는 거요."
      link: /studies/linear-algebra/rotation-bridge/
      link_label: 덧셈정리 ↔ 회전 행렬
  talk:
    - text: "f(x − 3)은 그래프를 오른쪽으로 옮겨요. 빼기라서 왼쪽 같은데, x = 3일 때 원래 f(0)이 나오거든요."
      link: /studies/college-math/function-transformation/
      link_label: 함수의 변환과 합성
    - text: "f⁻¹(x)를 1/f(x)로 읽으면 안 돼요. 그냥 '되돌리는 함수'라는 이름표예요."
      link: /studies/college-math/inverse-function/
      link_label: 역함수
    - text: "log(x + y)는 log x + log y가 아니에요. 로그가 바꿔 주는 건 곱이에요."
      link: /studies/college-math/logarithm/
      link_label: 로그
    - text: "파이썬에서 math.sin(30) 하면 0.5가 안 나와요. 30라디안이라 −0.988이에요. 에러도 안 나서 한참 뒤에 발견하는 버그예요."
      link: /studies/college-math/radian/
      link_label: 각과 라디안
    - text: "지수적 성장이 처음부터 빠른 건 아니에요. 1.01ˣ는 x = 100일 때 겨우 2.7인데, x = 917쯤에서 10x를 따라잡고 그 뒤로는 끝없이 벌어져요."
      link: /studies/college-math/exponential-function/
      link_label: 지수함수
    - text: "8을 2진수로 쓰면 1000, 네 자리예요. lg 8은 3이니까 하나 더 필요한 거죠."
      link: /studies/college-math/positional-notation/
      link_label: 진법과 자릿수
    - text: "√(−4) × √(−9)는 6이 아니라 −6이에요. 2i × 3i거든요."
      link: /studies/college-math/complex-numbers/
      link_label: 복소수
    - text: "로그 그래프에서 직선이라고 비례하는 건 아니에요. 로그-로그면 거듭제곱, 반로그면 지수예요."
      link: /studies/college-math/log-scale/
      link_label: 로그 스케일
    - text: "근의 공식을 코드에 그대로 넣으면 틀릴 때가 있어요. x² + 10⁸x + 1 = 0의 작은 근이 25%나 어긋나요."
      link: /studies/college-math/polynomial/
      link_label: 다항식과 방정식
    - text: "sin(α + β)는 sin α + sin β가 아니에요. α = β = π/2만 넣어 봐도 0이랑 2로 달라요."
      link: /studies/college-math/trig-identities/
      link_label: 삼각함수 항등식

discrete-math:
  greeting: "이산수학이에요. 혼자 공부하면서 정리했어요. 알고리즘 공부의 바닥을 다지는 과목이에요."
  questions:
    - q: 뭐부터 보면 돼요?
      a: "논리와 증명, 집합·함수·관계, 귀납과 재귀, 셈, 점화식, 정수론, 그래프 순서예요. 대학수학의 로그랑 수열은 먼저 보고 오시면 편해요."
      link: /studies/discrete-math/
      link_label: 로드맵
    - q: 어려워요?
      a: "증명을 처음 써 보면 1단원이 제일 고비예요. 무거운 개념도 {heavy}개라 많은 편이에요."
      link: /studies/discrete-math/proof-methods/
      link_label: 추론 규칙과 증명 방법
    - q: 배워서 어디에 써요?
      a: "코드에 바로 써요. 꼬인 조건문을 드모르간으로 풀고, 경우의 수로 브루트포스가 될지 판단하고, 반복문이 맞는지 귀납법으로 보여요. RSA 암호도 여기서 나와요."
    - q: 제일 중요한 건 뭐예요?
      a: "'수학적 귀납법'이요. 문서 여섯 개가 이걸 깔고 있고, 알고리즘의 루프 불변식이랑도 같은 얘기예요."
      link: /studies/discrete-math/induction/
      link_label: 수학적 귀납법
    - q: 다른 과목이랑도 이어져요?
      a: "알고리즘이랑 제일 많이 이어져요. 귀납법은 루프 불변식으로, 추이 폐포는 플로이드–워셜로, 위상 정렬은 DP 계산 순서로 가요."
      link: /studies/algorithms/induction-loop-invariant/
      link_label: 귀납법 ↔ 루프 불변식
  talk:
    - text: "'p이면 q'는 p가 거짓이면 그냥 참이에요. '1 = 2이면 달은 치즈다'도 논리적으론 참이에요."
      link: /studies/discrete-math/propositional-logic/
      link_label: 명제와 논리 연산
    - text: "'비 오면 땅이 젖는다'가 맞아도 '땅이 젖었으면 비가 왔다'는 아닐 수 있어요. 스프링클러가 있잖아요."
      link: /studies/discrete-math/logical-equivalence/
      link_label: 논리적 동치
    - text: "예를 아무리 많이 확인해도 증명은 아니에요. n² + n + 41은 0부터 39까지 다 소수인데 40에서 깨져요."
      link: /studies/discrete-math/proof-methods/
      link_label: 증명 방법
    - text: "∅랑 {∅}는 달라요. 빈 상자랑, 빈 상자가 하나 든 상자 차이예요."
      link: /studies/discrete-math/sets/
      link_label: 집합
    - text: "귀납 가정이 순환 논증 같죠? 사실은 'P(n)이면 P(n+1)'만 보이는 거라, 기저가 있어야 도미노가 넘어가요."
      link: /studies/discrete-math/induction/
      link_label: 수학적 귀납법
    - text: "5명 중 2명 뽑기는 20가지가 아니라 10가지예요. 20은 순서까지 센 거예요."
      link: /studies/discrete-math/permutations-combinations/
      link_label: 순열과 조합
    - text: "O가 작다고 늘 빠른 건 아니에요. n이 100보다 작으면 n²이 100n보다 작거든요."
      link: /studies/discrete-math/asymptotic-notation/
      link_label: 점근 표기
    - text: "−7 mod 3은 수학에선 2예요. 파이썬도 2인데, C랑 Java는 −1을 줘서 헷갈려요."
      link: /studies/discrete-math/modular-arithmetic/
      link_label: 나눗셈과 합동
    - text: "교과서 그대로 짠 RSA는 안전하지 않아요. 같은 평문이 늘 같은 암호문이 되거든요. 실제론 패딩을 붙여요."
      link: /studies/discrete-math/rsa/
      link_label: RSA 암호
    - text: "정점 n개에 간선 n − 1개라고 다 트리는 아니에요. 연결돼 있거나 사이클이 없어야 해요."
      link: /studies/discrete-math/trees/
      link_label: 트리

calculus:
  greeting: "미분적분학이에요. 혼자 공부하면서 정리했어요. 극한에서 시작해서 경사 하강법이랑 푸리에까지 가요."
  questions:
    - q: 뭐부터 보면 돼요?
      a: "극한과 연속, 미분, 적분, 급수, 다변수, 최적화, 미분방정식과 푸리에 순서예요. 다변수 들어가기 전에 선형대수의 벡터랑 내적은 보고 오세요."
      link: /studies/calculus/
      link_label: 로드맵
    - q: 어려워요?
      a: "앞 단원이 뒤를 계속 받쳐요. 극한에서 테일러 급수까지 11단계로 이어져서, 앞이 약하면 뒤가 무너지는 과목이에요."
    - q: 배워서 어디에 써요?
      a: "머신러닝의 엔진이에요. 경사 하강법도 역전파도 결국 미분이에요. 원시함수를 모르는 적분은 리만 합으로 그냥 계산해요."
      link: /studies/calculus/backprop-bridge/
      link_label: 연쇄 법칙 ↔ 역전파
    - q: 제일 중요한 건 뭐예요?
      a: "'극한'이랑 '미적분의 기본정리'요. 응용으로 가려면 '연쇄 법칙'은 꼭 잡으세요."
      link: /studies/calculus/chain-rule/
      link_label: 연쇄 법칙
    - q: 다른 과목이랑도 이어져요?
      a: "합이랑 적분은 이산수학이랑, 사잇값 정리는 알고리즘의 매개변수 탐색이랑 이어져요. 눈이 색을 느끼는 것도 적분으로 써요."
      link: /studies/algorithms/parametric-search-ivt/
      link_label: 매개변수 탐색 ↔ 사잇값 정리
  talk:
    - text: "극한값이 그 점의 함숫값이랑 꼭 같진 않아요. 둘이 같을 때를 따로 '연속'이라고 불러요."
      link: /studies/calculus/limits/
      link_label: 극한
    - text: "연속이라고 다 미분되는 건 아니에요. |x|는 0에서 꺾여 있어서 미분이 안 돼요. ReLU도 그래요."
      link: /studies/calculus/derivative/
      link_label: 도함수
    - text: "(fg)′는 f′g′가 아니에요. 직사각형 가로랑 세로가 각각 늘어난 걸 더해서 f′g + fg′예요."
      link: /studies/calculus/differentiation-rules/
      link_label: 미분 법칙
    - text: "합성함수 미분에서 안쪽 도함수 곱하는 걸 많이들 까먹어요. f′(g(x)) · g′(x)예요."
      link: /studies/calculus/chain-rule/
      link_label: 연쇄 법칙
    - text: "도함수가 0이라고 다 극값은 아니에요. x³은 0에서 기울기가 0인데 계속 올라가요."
      link: /studies/calculus/curve-analysis/
      link_label: 도함수의 활용과 최적화
    - text: "정적분이 넓이랑 늘 같진 않아요. sin x를 0부터 2π까지 적분하면 0인데 넓이는 4예요."
      link: /studies/calculus/riemann-integral/
      link_label: 정적분과 리만 합
    - text: "테일러 급수는 항을 늘린다고 어디서나 정확해지진 않아요. ln(1 + x)는 x = 2에서 오히려 크게 흔들려요."
      link: /studies/calculus/taylor-series/
      link_label: 테일러 급수
    - text: "학습률을 키운다고 늘 빨라지진 않아요. x²에서 0.5는 한 번에 끝나는데 1.1은 튕겨 나가요."
      link: /studies/calculus/gradient-descent/
      link_label: 경사 하강법
    - text: "기울기가 0이 돼서 멈췄다고 최솟값이 아닐 수 있어요. 안장점일 수도 있거든요."
      link: /studies/calculus/gradient-descent/
      link_label: 경사 하강법
    - text: "이웃한 항 차이가 0으로 가도 수렴 안 할 수 있어요. 1 + 1/2 + 1/3 + …은 끝없이 커져요."
      link: /studies/calculus/sequence-limits/
      link_label: 수열의 극한과 e

linear-algebra:
  greeting: "선형대수학이에요. 혼자 공부하면서 정리했어요. 벡터에서 시작해서 특잇값 분해까지 가요."
  questions:
    - q: 뭐부터 보면 돼요?
      a: "벡터, 행렬과 연립방정식, 벡터공간과 선형변환, 직교성, 고윳값과 분해, 응용 순서예요. 앞뒤가 13단계로 길게 이어져서 순서를 지키는 게 중요해요."
      link: /studies/linear-algebra/
      link_label: 로드맵
    - q: 어려워요?
      a: "계산은 손에 익으면 되는데, '공간'으로 생각하는 게 어려워요. 열공간, 영공간, 랭크는 한 묶음으로 보면 덜 헷갈려요."
      link: /studies/linear-algebra/four-subspaces/
      link_label: 랭크와 네 부분공간
    - q: 배워서 어디에 써요?
      a: "추천이나 검색에 쓰는 코사인 유사도, 신경망 층의 Wx + b가 다 선형대수예요. NumPy의 solve도 안에서 가우스 소거를 해요."
      link: /studies/linear-algebra/dot-product/
      link_label: 내적과 노름
    - q: 제일 중요한 건 뭐예요?
      a: "'역행렬'이랑 '가우스 소거법'이 뒤를 많이 받쳐요. '고윳값과 고유벡터'는 대각화, 스펙트럼 정리, SVD로 가는 문이고요."
      link: /studies/linear-algebra/eigenvalues/
      link_label: 고윳값과 고유벡터
    - q: 다른 과목이랑도 이어져요?
      a: "휴먼 인터페이스 미디어랑 많이 겹쳐요. 뉴런 층이 o = Ax + b고, 퍼셉트론이 wᵀx + b예요. 이산수학의 점화식도 행렬 거듭제곱으로 풀려요."
      link: /studies/linear-algebra/recurrence-matrix-bridge/
      link_label: 선형 점화식 ↔ 행렬 거듭제곱
  talk:
    - text: "내적이 크다고 더 비슷한 건 아니에요. 길이에도 비례하거든요. 방향만 보려면 코사인 유사도를 써요."
      link: /studies/linear-algebra/dot-product/
      link_label: 내적과 노름
    - text: "Ax + b는 선형변환이 아니에요. 0을 0으로 안 보내서 '아핀'이라고 불러요."
      link: /studies/linear-algebra/matrix-vector/
      link_label: 행렬과 행렬-벡터 곱
    - text: "식이랑 미지수 개수가 같아도 해가 하나라는 보장은 없어요. x + y = 1, 2x + 2y = 3은 해가 아예 없어요."
      link: /studies/linear-algebra/gaussian-elimination/
      link_label: 가우스 소거법
    - text: "평면에서 벡터 세 개는 늘 종속이에요. 서로 평행한 게 하나도 없어도요."
      link: /studies/linear-algebra/linear-independence/
      link_label: 선형독립
    - text: "기저는 하나가 아니에요. 무수히 많고, 정해진 건 개수뿐이에요. 그게 차원이에요."
      link: /studies/linear-algebra/basis-dimension/
      link_label: 기저와 차원
    - text: "det(2A)는 2 det A가 아니라 2ⁿ det A예요. 가로, 세로를 다 2배 하면 넓이는 4배잖아요."
      link: /studies/linear-algebra/determinant/
      link_label: 행렬식
    - text: "선형변환이 모양을 지켜 주진 않아요. 원이 타원이 되고 정사각형이 평행사변형이 돼요."
      link: /studies/linear-algebra/linear-transformations/
      link_label: 선형변환
    - text: "최소제곱은 점에서 직선까지 수직 거리를 줄이는 게 아니라 세로 차이만 줄여요."
      link: /studies/linear-algebra/least-squares/
      link_label: 최소제곱법
    - text: "고윳값이 겹쳐도 대각화될 수 있어요. 단위행렬은 1이 n번 겹치는데 이미 대각이잖아요."
      link: /studies/linear-algebra/diagonalization/
      link_label: 대각화
    - text: "특잇값이 고윳값 절댓값이랑 같은 건 대칭행렬일 때뿐이에요."
      link: /studies/linear-algebra/svd/
      link_label: 특잇값 분해

probability-statistics:
  greeting: "확률과 통계예요. 혼자 공부하면서 정리했어요. 주사위에서 시작해서 머신러닝이랑 정보이론까지 가요."
  questions:
    - q: 뭐부터 보면 돼요?
      a: "확률의 기초부터 이산, 연속, 여러 변수, 극한 정리, 확률 과정, 추론, 데이터 모델, 정보이론까지 아홉 단원이에요."
      link: /studies/probability-statistics/
      link_label: 로드맵
    - q: 어려워요?
      a: "공학수학 다른 네 과목을 다 끌어와서 써요. 셈, 적분, 행렬이 다 나와요. 무거운 개념도 {heavy}개예요."
    - q: 배워서 어디에 써요?
      a: "스팸 필터, A/B 테스트, 오차 막대, 신뢰구간이 다 여기서 나와요. 회귀 모델도 결국 조건부 기댓값을 어림하는 거예요."
      link: /studies/probability-statistics/bayes-theorem/
      link_label: 베이즈 정리
    - q: 제일 중요한 건 뭐예요?
      a: "'분산과 표준편차'랑 '기댓값과 선형성'이 뒤를 제일 많이 받쳐요. '조건부 확률'은 베이즈 정리로 가는 문이고요."
      link: /studies/probability-statistics/expectation/
      link_label: 기댓값과 선형성
    - q: 다른 과목이랑도 이어져요?
      a: "이상 심리학에서 '통계적으로 이상'이라고 할 때가 정규분포 꼬리예요. 컴퓨터 통신의 동시 사용자 수는 이항분포고요."
      link: /studies/abnormal-psychology/statistical-deviation--normal-distribution/
      link_label: 통계적 일탈 ↔ 정규분포
  talk:
    - text: "정확도 99% 검사에서 양성이 나와도 병일 확률이 99%는 아니에요. 병이 드물면 9%까지 떨어지기도 해요."
      link: /studies/probability-statistics/bayes-theorem/
      link_label: 베이즈 정리
    - text: "농구 선수가 키 190 넘을 확률은 높은데, 키 190 넘는 사람이 농구 선수일 확률은 낮잖아요. P(A|B)랑 P(B|A)는 달라요."
      link: /studies/probability-statistics/conditional-probability/
      link_label: 조건부 확률
    - text: "합의 기댓값을 쪼갤 땐 독립이 필요 없어요. 그래서 모자 문제 답이 딱 1이에요."
      link: /studies/probability-statistics/expectation/
      link_label: 기댓값과 선형성
    - text: "몇 번 연속 졌다고 이번엔 이길 확률이 높아지진 않아요. 주사위는 지난 판을 기억 못 해요."
      link: /studies/probability-statistics/geometric-distribution/
      link_label: 기하분포
    - text: "아이스크림 판매랑 물놀이 사고가 같이 늘어도 아이스크림 때문은 아니에요. 둘 다 더위 때문이에요."
      link: /studies/probability-statistics/covariance/
      link_label: 공분산과 상관계수
    - text: "자료를 많이 모은다고 자료가 정규분포가 되는 건 아니에요. 정규에 가까워지는 건 평균들이에요."
      link: /studies/probability-statistics/clt/
      link_label: 중심극한정리
    - text: "95% 신뢰구간이 '참값이 여기 있을 확률 95%'는 아니에요. 그렇게 구간을 만드는 방법이 95%로 맞는다는 거예요."
      link: /studies/probability-statistics/confidence-intervals/
      link_label: 신뢰구간
    - text: "p = 0.03은 귀무가설이 맞을 확률 3%가 아니에요. 귀무가설이 맞을 때 이런 자료가 나올 확률이에요."
      link: /studies/probability-statistics/hypothesis-testing/
      link_label: 가설검정과 p값
    - text: "엔트로피가 높다고 좋은 정보가 많은 건 아니에요. 무작위 잡음이 엔트로피가 제일 높거든요."
      link: /studies/probability-statistics/entropy/
      link_label: 엔트로피
    - text: "3σ 밖은 0.3%라는 건 정규분포 얘기예요. 꼬리가 두꺼운 분포는 1%가 넘기도 해요."
      link: /studies/probability-statistics/normal-distribution/
      link_label: 정규분포

algorithms:
  greeting: "알고리즘이에요. 프로그래머스 문제 풀면서 정리했어요. 코드는 다 파이썬이에요."
  questions:
    - q: 뭐부터 보면 돼요?
      a: "파이썬 기본기, 구현, 자료구조, 탐색, 그래프와 트리, DP, 고급 기법 순서예요. 다익스트라까지도 6단계라서 문제 풀면서 금방 올라가요."
      link: /studies/algorithms/
      link_label: 로드맵
    - q: 어려워요?
      a: "개념보다 '이 문제 무슨 기법이지?'를 알아보는 게 어려워요. 그래서 기법 문서에 '이런 말이 보이면 이 기법' 같은 신호를 적어 뒀어요."
    - q: 배워서 어디에 써요?
      a: "코딩 테스트에 바로 써요. 입력 크기만 보고 쓸 수 있는 방법을 미리 고르는 '시간 복잡도 어림'은 모든 풀이에서 제일 먼저 해요."
      link: /studies/algorithms/complexity-budget/
      link_label: 시간 복잡도로 방법 고르기
    - q: 제일 중요한 건 뭐예요?
      a: "'리스트와 문자열'이요. 문서 11개가 이걸 깔고 있어요. 그다음이 시간 복잡도 어림이고요."
      link: /studies/algorithms/list-string/
      link_label: 리스트와 문자열
    - q: 다른 과목이랑도 이어져요?
      a: "공학수학이랑 브리지 문서 일곱 개로 이어져요. 귀납법이 루프 불변식이고, 누적 합이 아래삼각행렬 곱이에요."
      link: /studies/algorithms/prefix-sum-triangular/
      link_label: 누적 합 ↔ 아래삼각행렬
  talk:
    - text: "코드 줄이 짧다고 빠른 건 아니에요. 리스트에 쓴 in은 한 줄인데, 재 보니 집합보다 1,000배쯤 느렸어요."
      link: /studies/algorithms/complexity-budget/
      link_label: 시간 복잡도로 방법 고르기
    - text: "파이썬 딕셔너리는 3.7부터 넣은 순서대로 돌아요. 집합은 아직 순서 약속이 없고요."
      link: /studies/algorithms/hash-dict-set/
      link_label: 딕셔너리와 집합
    - text: "재귀로 리스트를 넘기면 복사되는 게 아니라 같은 걸 가리켜요. append한 건 꼭 pop으로 돌려놔야 해요."
      link: /studies/algorithms/recursion-backtracking/
      link_label: 재귀와 백트래킹
    - text: "이분 탐색에서 lo = mid로 두면 무한 루프에 빠질 수 있어요. 마지막 두 칸에서 안 줄어들거든요."
      link: /studies/algorithms/binary-search/
      link_label: 이분 탐색
    - text: "이분 탐색이 꼭 정렬된 배열에서만 되는 건 아니에요. 답이 '아니오…아니오, 예…예' 모양이면 돼요."
      link: /studies/algorithms/parametric-search/
      link_label: 매개변수 탐색
    - text: "그리디는 예시 몇 개 맞았다고 믿으면 안 돼요. 회의실 배정도 '먼저 끝나는 것'만 늘 맞아요."
      link: /studies/algorithms/greedy/
      link_label: 그리디
    - text: "BFS에선 큐에 넣을 때 방문 표시를 해야 해요. 꺼낼 때 하면 같은 칸이 여러 번 들어가요."
      link: /studies/algorithms/bfs/
      link_label: 너비 우선 탐색
    - text: "다익스트라는 처음 발견했을 때 확정하면 안 돼요. 힙에서 꺼낼 때 확정해요."
      link: /studies/algorithms/dijkstra/
      link_label: 다익스트라
    - text: "메모이제이션이 만능은 아니에요. 같은 부분 문제가 다시 나와야 이득이에요."
      link: /studies/algorithms/dynamic-programming/
      link_label: 동적 계획법
    - text: "기울기를 나눗셈으로 비교하면 세로선에서 터져요. 외적을 쓰면 깔끔해요."
      link: /studies/algorithms/geometry-ccw/
      link_label: 계산 기하 기초
