# Update log shown at the bottom of /about/ (about.html). Newest first.
# Each entry: date, title, items (one line each).
- date: 2026-10-09
  title: 읽기 편하게 다듬기
  items:
    - 검색 버튼을 길게 늘렸어요. 휴대폰에서도 '문서 검색' 글자가 보여요.
    - 휴대폰에서 다이어그램이 글자를 못 읽을 만큼 작아지지 않아요. 넓은 그림은 원래 크기에 가깝게 두고 옆으로 밀어서 봐요.
    - 노트 왼쪽 목차가 로고를 덮어 홈으로 못 가던 문제를 고쳤어요.
    - 떠다니는 도형이 글자 위를 지날 때는 흐려져요.
    - 휴대폰에서 아래로 읽는 동안 홍철과 '목차' 버튼이 비켜나요. 위로 조금 올리면 다시 나와요.
    - 검색 미리보기의 수식을 읽기 쉽게 바꾸고, 다른 이름이 정확히 맞는 문서를 위로 올렸어요. '고유값'과 '고윳값'처럼 사이시옷만 다른 말도 함께 찾아요. 코드 페이지는 파일 이름으로 찾을 때만 앞에 나와요.
    - 각주의 '에이전트 보충.'을 '보충' 표시로, 자료 경로를 '○○ 4회 강의 자료 「…」'처럼 짧게 바꿨어요.
    - 로드맵 한 줄 설명에서 날것으로 보이던 거듭제곱과 아래 첨자를 제대로 보여 줘요.
    - 그림이 늦게 떠도 글이 밀리지 않게 자리를 먼저 잡아 둬요. 다이어그램 화살표 글자의 흰 상자도 없앴어요.
- date: 2026-10-09
  title: 카드 풀기와 복습 페이지 정리
  items:
    - 카드 풀기, 복습 페이지, 진도 점과 진도 막대를 없앴어요. 확인 문제는 예전처럼 눌러서 답을 펼쳐 봐요.
    - 시험 일정(중간·기말 날짜, 남은 날 표시)을 사이트에서 뺐어요.
    - 움직여 보는 그림 6개는 그대로예요.
- date: 2026-10-09
  title: 다이어그램 보충
  items:
    - 13과목 노트에 흐름도, 상태도, 순서도, 분류 트리, 배치도 등 다이어그램 300여 개를 더했어요. 절차와 구조를 글로만 따라가지 않아도 돼요.
- date: 2026-10-09
  title: 카드 풀기, 진도, 움직이는 그림
  items:
    - 노트의 확인 문제를 풀 수 있게 됐어요. 답을 먼저 써 보고 확신도를 고른 뒤 답을 열고, 맞았는지 스스로 매겨요. 다음 복습 날짜가 자동으로 잡혀요.
    - Studies › 복습 페이지에서 오늘 복습할 카드와 새 카드를 과목을 섞어 풀어요. 기록은 이 브라우저에만 남고, CSV와 백업으로 내려받을 수 있어요.
    - 노트 목차와 과목 로드맵에 개념마다 진도 점이 생겼어요. 과목 페이지에는 진도 막대, 다음에 배울 수 있는 것, 시험까지 남은 날이 보여요.
    - 테일러 다항식, 컨벌루션, 푸리에 부분합, 중심극한정리, 평균 창, 복소수 파동 그림을 직접 움직여 볼 수 있어요.
- date: 2026-10-09
  title: 노트 목차, 전체 검색, 업데이트 로그
  items:
    - 노트 왼쪽에 과목 로드맵 목차가 생겼어요. 지금 회차는 펼쳐 두고, 그 아래에 이 문서의 소제목을 보여 줘요. 좁은 화면에서는 왼쪽 아래 '목차' 버튼으로 열어요.
    - 모든 문서를 한 번에 찾는 검색을 넣었어요. 위의 검색 버튼이나 ⌘K(Ctrl K), '/'로 열어요.
    - 이 업데이트 로그를 만들었어요.
    - 목차에서 이 문서의 소제목(예시로 보기, 정의 …)을 한 단계 들여 쓰고, 옆의 화살표로 접고 펼 수 있게 했어요. 접은 상태는 다음 문서에서도 그대로예요.
- date: 2026-10-09
  title: 데이터 과학, 수치해석, 그림 319장
  items:
    - Studies에 데이터 과학과 수치해석을 더했어요. 휴먼 인터페이스 미디어 4~6강(파동, 이미지, 모양 맞추기)도 들어왔어요.
    - 수식이 있는 노트에 함수 모양, 수렴 과정, 분포, 신호를 보여 주는 그림 319장을 넣었어요.
- date: 2026-10-08
  title: 과목을 주제별로 묶기
  items:
    - Studies에 운영체제와 신호 및 시스템을 더했어요.
    - 과목을 학기 대신 수학, 컴퓨터 과학, 심리학 주제로 묶었어요.
- date: 2026-10-07
  title: 홍철과 대화하기
  items:
    - 오른쪽 아래 홍철이 갈래가 나뉘는 대화를 해요. 과목마다 대사가 훨씬 많아졌어요.
    - 다시 찾아온 방문자를 기억해요. 기록은 방문자의 브라우저에만 남아요.
- date: 2026-10-06
  title: 프로젝트 넷, 책 같은 Studies 목차
  items:
    - 프로젝트 네 개(G2B Masters, studyweb, sharpCouncil, cft)를 더했어요.
    - Studies에 책처럼 생긴 목차를 화면 왼쪽에 붙였어요.
    - 링크를 공유하면 사이트와 과목마다 다른 미리보기 카드가 떠요.
    - 노트를 쉬운 말로 다시 썼어요.
- date: 2026-10-05
  title: Studies 공개와 새 디자인
  items:
    - Obsidian에 정리한 강의 노트 9과목을 /studies/에 올렸어요.
    - 스크롤에 따라 바뀌는 기하학 배경, 과목별 색과 움직이는 그림, 로고와 프로필 사진을 넣었어요.
    - 픽셀 로봇이 생겼어요(10월 6일에 이름이 홍철이 됐어요).
    - 네이버 블로그의 팡세 8편을 옮겨 왔어요.
- date: 2026-07-18
  title: 사이트 첫 공개
  items:
    - 에디토리얼 스타일의 Jekyll 사이트를 열었어요. 팡세 17편, 프로젝트 NL-Miner와 DocSim이 첫 글이에요.
    - 모바일 화면, 한국어 글꼴(나눔명조), 서울 시간대를 맞췄어요.
