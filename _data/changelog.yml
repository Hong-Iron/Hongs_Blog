# Update log shown at the bottom of /about/ (about.html). Newest first.
# Each entry: date, title, items (one line each).
- date: 2026-10-12
  title: 데이터베이스 설계
  items:
    - Studies에 데이터베이스 설계를 더했어요. 개념 78개, 연습 18개, 파이썬과 SQL 코드 134개예요. 질의는 SQLite와 PostgreSQL에서 돌려 확인했어요.
    - 과목 표지에서 직원 표의 줄이 부서 표의 줄을 하나씩 찾아가 결과 표를 채워요.
    - 로드맵 표의 "(강조)" 옆 각주가 글자 그대로 보이던 것을 고쳤어요.
- date: 2026-10-12
  title: 자료구조
  items:
    - Studies에 자료구조를 더했어요. 개념 52개, 연습 18개, C와 파이썬 코드 85개예요.
    - 과목 표지에서 최대 힙에 값이 하나씩 들어가요. 위의 나무와 아래 배열이 같은 힙이에요.
- date: 2026-10-12
  title: About에 지금 하는 일과 활동
  items:
    - About에 지금 하는 일(DOOH-BU 백엔드 개발)과 활동(중앙대 CCC 대표 순장, 2025년 2학기부터 2026년 1학기까지)을 적었어요.
    - 경력으로 일렉테리어에서 2026년 여름방학 동안 G2B Masters를 개발한 것도 적었어요.
    - 맨 위에 한 문단 소개를 넣었어요. About의 소개와 이력은 영어로만 적어요.
    - 대표 순장으로 한 일을 따로 한 단락으로 정리했어요. 방향을 문서로 적기, 기록 체계 다시 짜기, 사역 관리 툴 개발, 행사 기획, 발표와 강의, 학교를 상대하는 일이에요.
- date: 2026-10-12
  title: Projects와 Pensées 새 단장
  items:
    - Projects는 지금 운영 중인 G2B Masters를 화면 사진, 역할, 기술과 함께 맨 위에 크게 두었어요. 나머지 프로젝트는 같은 크기 카드로 놓고, 카드마다 쓴 기술을 한 줄 달았어요.
    - Pensées는 최신 글 한 편을 맨 위에 크게 보여 줘요. 지난 글은 카드로 놓였고, 사진이 없는 글은 발췌 한 문장을 인용문처럼 얹었어요.
    - Pensées 오른쪽 위 단추로 카드와 목록을 바꿀 수 있어요. 목록은 연도별로 묶은 한 줄짜리예요. 휴대폰에서는 처음에 목록으로 열려요.
- date: 2026-10-12
  title: G2B Masters 화면 사진
  items:
    - G2B Masters 프로젝트 글에 실제 검색 화면 사진을 넣었어요.
- date: 2026-10-12
  title: Studies를 카드 격자로
  items:
    - Studies의 과목을 한 줄에 하나씩 크게 보여 주던 것을 카드 격자로 바꿨어요. PC에서는 네 장, 작은 창에서는 세 장, 휴대폰에서는 두 장씩 놓여요. 페이지 길이가 3분의 1로 줄었어요.
    - 과목이 둘뿐인 세부 묶음은 한 줄에 나란히 놓여요. 카드에 마우스를 올리면 목차의 그 과목이 표시되고, 목차의 과목에 올리면 그 카드가 떠올라요.
    - 목차와 카드 사이의 빈 곳을 줄였어요. 카드가 목차 바로 옆에서 시작해요.
- date: 2026-10-12
  title: 과목 네 묶음, 한눈에 보이는 목차
  items:
    - Studies의 과목을 네 묶음으로 다시 나눴어요. 수학(5), 데이터와 계산(4), 컴퓨터 과학(7), 사람과 심리(2)예요. 자료와 정보, 신호 및 시스템, 수치해석은 수학에서 '데이터와 계산'으로, 휴먼 인터페이스 미디어는 '사람과 심리'로 옮겼어요. 과목 주소와 노트는 그대로예요.
    - 큰 묶음 안에는 세부 묶음을 두었어요. 데이터와 계산은 '데이터'와 '신호와 수치 계산'으로, 컴퓨터 과학은 '소프트웨어'와 '컴퓨터 시스템'으로 나뉘어요. 목차에는 작은 이름표로, 본문에는 작은 제목으로 나와요.
    - Studies 왼쪽 목차를 다시 짰어요. 묶음 이름을 굵고 진하게 쓰고 묶음 사이에 가는 선을 넣었어요. 과목 앞의 번호 대신 과목 색 점을 달았고, 점선은 뺐어요.
    - 지금 보고 있는 과목은 글자를 키우는 대신 과목 색 바탕으로 표시해요. 줄 간격이 창 높이에 맞춰 늘고 줄어서, 노트북 화면에서도 목차 전체가 스크롤 없이 보여요.
- date: 2026-10-12
  title: 검색 단추를 검색 바로
  items:
    - 위쪽의 검색 단추를 로고와 메뉴 사이를 채우는 긴 검색 바로 바꿨어요. 누르면 전처럼 검색 창이 열려요.
- date: 2026-10-12
  title: 목차 접기, 본문을 화면 가운데로
  items:
    - 노트 왼쪽의 목차를 접을 수 있어요. 목차 위의 « 단추를 누르면 사라지고, 왼쪽 위의 '목차' 단추로 다시 펼쳐요. 접어 둔 상태는 다른 노트로 넘어가도 그대로예요.
    - 노트 본문이 목차만큼 오른쪽으로 밀려 있던 것을 화면 가운데로 옮겼어요. 제목과 본문, 이전·다음 링크의 왼쪽 선도 맞췄어요.
- date: 2026-10-12
  title: 컴퓨터 구조
  items:
    - Studies에 컴퓨터 구조(컴퓨터 과학)를 더했어요. 성능과 논리 회로, MIPS 명령어와 산술, 단일 사이클과 5단계 파이프라인, 캐시와 멀티코어까지 개념 44개와 예제 사다리 5개예요.
    - 이 과목은 강의 자료가 없어서 교재 목차를 따라 공개 강의 자료를 보고 새로 썼어요. 회로, 파이프라인, 캐시의 동작은 파이썬으로 흉내 내 확인했어요.
    - "'자바'를 '자바 프로그래밍'으로 이름을 바꿨어요. 주소는 그대로예요."
- date: 2026-10-12
  title: 자바 프로그래밍으로 이름 바꾸기, 표지 새로 그리기
  items:
    - "'소프트웨어 프로젝트'를 '자바 프로그래밍'으로 이름을 바꿨어요. 주소도 /studies/java/로 바뀌었어요."
    - 자바 프로그래밍, 어셈블리어, 컴파일러의 표지를 새로 그렸어요. 자바 프로그래밍은 클래스 틀이 객체를 찍어 내고, 어셈블리어는 실행 위치가 내려가며 레지스터 비트와 플래그가 바뀌고, 컴파일러는 토큰 아래로 구문 트리가 자라 코드가 나와요.
- date: 2026-10-12
  title: 어셈블리어, 컴파일러
  items:
    - Studies에 어셈블리어(컴퓨터 과학)를 더했어요. x86 레지스터와 플래그, 스택과 프로시저, 조건 점프, 시프트, 스택 프레임, MS-DOS·BIOS 인터럽트까지 개념 56개와 연습 11개예요. 실행 결과는 파이썬으로 레지스터와 스택을 흉내 내 확인했어요.
    - 컴파일러(컴퓨터 과학)를 더했어요. 정규 표현식과 오토마타, LL(1)·SLR 파싱, 타입 검사, 3주소 코드, 최적화, 레지스터 할당까지 개념 56개와 연습 13개예요. 알고리즘을 파이썬으로 구현해 슬라이드의 표와 추적을 재현했어요.
    - 두 과목은 서로 이어져요. 컴파일러의 활성 레코드와 어셈블리어의 스택 프레임, 유한 오토마타와 유한 상태 기계가 서로 링크돼 있어요.
- date: 2026-10-11
  title: 자료와 정보, 소프트웨어 프로젝트
  items:
    - Studies에 자료와 정보(수학)를 더했어요. 2진 표현과 부동소수점, 해밍 부호, 거리와 유사도, 편집 거리, 확률 과정, 파젠 창까지 개념 17개와 예제 사다리 2개예요. 군집화와 확률 부분은 데이터 과학, 확률과 통계 문서의 '과목별 관점'에 합쳤어요.
    - 소프트웨어 프로젝트(컴퓨터 과학)를 더했어요. Java 기초부터 클래스, 상속, 인터페이스, 예외, 제네릭까지 개념 39개예요. 문서에 실은 출력은 모두 JDK 21에서 돌려 확인했고, Java 코드 페이지도 볼 수 있어요.
- date: 2026-10-09
  title: 읽기 편하게 다듬기
  items:
    - 검색 버튼을 길게 늘렸어요. 휴대폰에서도 '문서 검색' 글자가 보여요.
    - 휴대폰에서 다이어그램이 글자를 못 읽을 만큼 작아지지 않아요. 넓은 그림은 원래 크기에 가깝게 두고 옆으로 밀어서 봐요.
    - 노트 왼쪽 목차가 로고를 덮어 홈으로 못 가던 문제를 고쳤어요.
    - 떠다니는 도형이 글자 위를 지날 때는 흐려져요.
    - 휴대폰에서 아래로 읽는 동안 홍철과 '목차' 버튼이 비켜나요. 위로 조금 올리면 다시 나와요.
    - 검색 미리보기의 수식을 읽기 쉽게 바꾸고, 다른 이름이 정확히 맞는 문서를 위로 올렸어요. '고유값'과 '고윳값'처럼 사이시옷만 다른 말도 함께 찾아요. 코드 페이지는 파일 이름으로 찾을 때만 앞에 나와요.
    - 각주의 '에이전트 보충.'을 '보충' 표시로, 자료 경로를 '○○ 4회 강의 자료 「…」'처럼 짧게 바꿨어요.
    - 로드맵 한 줄 설명에서 날것으로 보이던 거듭제곱과 아래 첨자를 제대로 보여 줘요.
    - 그림이 늦게 떠도 글이 밀리지 않게 자리를 먼저 잡아 둬요. 다이어그램 화살표 글자의 흰 상자도 없앴어요.
- date: 2026-10-09
  title: 카드 풀기와 복습 페이지 정리
  items:
    - 카드 풀기, 복습 페이지, 진도 점과 진도 막대를 없앴어요. 확인 문제는 예전처럼 눌러서 답을 펼쳐 봐요.
    - 시험 일정(중간·기말 날짜, 남은 날 표시)을 사이트에서 뺐어요.
    - 움직여 보는 그림 6개는 그대로예요.
- date: 2026-10-09
  title: 다이어그램 보충
  items:
    - 13과목 노트에 흐름도, 상태도, 순서도, 분류 트리, 배치도 등 다이어그램 300여 개를 더했어요. 절차와 구조를 글로만 따라가지 않아도 돼요.
- date: 2026-10-09
  title: 카드 풀기, 진도, 움직이는 그림
  items:
    - 노트의 확인 문제를 풀 수 있게 됐어요. 답을 먼저 써 보고 확신도를 고른 뒤 답을 열고, 맞았는지 스스로 매겨요. 다음 복습 날짜가 자동으로 잡혀요.
    - Studies › 복습 페이지에서 오늘 복습할 카드와 새 카드를 과목을 섞어 풀어요. 기록은 이 브라우저에만 남고, CSV와 백업으로 내려받을 수 있어요.
    - 노트 목차와 과목 로드맵에 개념마다 진도 점이 생겼어요. 과목 페이지에는 진도 막대, 다음에 배울 수 있는 것, 시험까지 남은 날이 보여요.
    - 테일러 다항식, 컨벌루션, 푸리에 부분합, 중심극한정리, 평균 창, 복소수 파동 그림을 직접 움직여 볼 수 있어요.
- date: 2026-10-09
  title: 노트 목차, 전체 검색, 업데이트 로그
  items:
    - 노트 왼쪽에 과목 로드맵 목차가 생겼어요. 지금 회차는 펼쳐 두고, 그 아래에 이 문서의 소제목을 보여 줘요. 좁은 화면에서는 왼쪽 아래 '목차' 버튼으로 열어요.
    - 모든 문서를 한 번에 찾는 검색을 넣었어요. 위의 검색 버튼이나 ⌘K(Ctrl K), '/'로 열어요.
    - 이 업데이트 로그를 만들었어요.
    - 목차에서 이 문서의 소제목(예시로 보기, 정의 …)을 한 단계 들여 쓰고, 옆의 화살표로 접고 펼 수 있게 했어요. 접은 상태는 다음 문서에서도 그대로예요.
- date: 2026-10-09
  title: 데이터 과학, 수치해석, 그림 319장
  items:
    - Studies에 데이터 과학과 수치해석을 더했어요. 휴먼 인터페이스 미디어 4~6강(파동, 이미지, 모양 맞추기)도 들어왔어요.
    - 수식이 있는 노트에 함수 모양, 수렴 과정, 분포, 신호를 보여 주는 그림 319장을 넣었어요.
- date: 2026-10-08
  title: 과목을 주제별로 묶기
  items:
    - Studies에 운영체제와 신호 및 시스템을 더했어요.
    - 과목을 학기 대신 수학, 컴퓨터 과학, 심리학 주제로 묶었어요.
- date: 2026-10-07
  title: 홍철과 대화하기
  items:
    - 오른쪽 아래 홍철이 갈래가 나뉘는 대화를 해요. 과목마다 대사가 훨씬 많아졌어요.
    - 다시 찾아온 방문자를 기억해요. 기록은 방문자의 브라우저에만 남아요.
- date: 2026-10-06
  title: 프로젝트 넷, 책 같은 Studies 목차
  items:
    - 프로젝트 네 개(G2B Masters, studyweb, sharpCouncil, cft)를 더했어요.
    - Studies에 책처럼 생긴 목차를 화면 왼쪽에 붙였어요.
    - 링크를 공유하면 사이트와 과목마다 다른 미리보기 카드가 떠요.
    - 노트를 쉬운 말로 다시 썼어요.
- date: 2026-10-05
  title: Studies 공개와 새 디자인
  items:
    - Obsidian에 정리한 강의 노트 9과목을 /studies/에 올렸어요.
    - 스크롤에 따라 바뀌는 기하학 배경, 과목별 색과 움직이는 그림, 로고와 프로필 사진을 넣었어요.
    - 픽셀 로봇이 생겼어요(10월 6일에 이름이 홍철이 됐어요).
    - 네이버 블로그의 팡세 8편을 옮겨 왔어요.
- date: 2026-07-18
  title: 사이트 첫 공개
  items:
    - 에디토리얼 스타일의 Jekyll 사이트를 열었어요. 팡세 17편, 프로젝트 NL-Miner와 DocSim이 첫 글이에요.
