# 홍철's lines for the Rust course pages. Format: _data/robot/README.md
greeting:
- "Rust예요. 수업이 아니라 혼자 공부한 과목이에요. 공식 문서를 보고 썼어요."
- "Rust 페이지예요. 내릴수록 배경에서 String 하나가 주인을 옮기고, 빌려졌다가, 마지막에 치워져요."
- "여긴 Rust예요. 문법에서 시작해 마지막엔 단축 URL 서비스를 직접 만들어요."
questions:
- q: "뭐부터 보면 돼요?"
  a: "'소유권과 이동'부터요. 값마다 치울 주인이 하나 있다는 규칙인데, 뒤에 나오는 빌림, 수명, 스레드가 전부 이 위에 서 있어요."
  link: /studies/rust/ownership-move/
  link_label: "소유권과 이동"
- q: 어려워요?
  a: "처음엔 컴파일러가 자꾸 막아서 답답해요. 그래서 빌림 오류를 하나씩 읽고 고치는 예제 사다리를 따로 만들어 뒀어요."
  link: /studies/rust/borrow-errors-ladder/
  link_label: "빌림 오류 고치기 예제 사다리"
- q: "답은 믿어도 돼요?"
  a: "코드 {codes}개를 전부 서식 검사, clippy 경고 0, 테스트, 실행까지 돌렸어요. 컴파일 오류 번호도 코드 안에서 컴파일러를 불러 확인했어요."
  link: /studies/rust/
  link_label: 로드맵
- q: "배워서 뭘 만들어요?"
  a: "마지막 단원에서 단축 URL 서비스를 여섯 단계로 키워요. 타입과 에러, SQLite 저장소, axum API, 로그와 설정, 안전한 종료, 테스트와 배포 순서예요."
  link: /studies/rust/capstone-1/
  link_label: "캡스톤 1 도메인 타입과 에러"
- q: "다른 과목이랑도 이어져요?"
  a: "C의 malloc·free, 자바의 인터페이스, 운영체제의 모니터와 하나씩 나란히 놓고 비교하는 문서가 있어요."
  link: /studies/rust/malloc-free-vs-ownership/
  link_label: "malloc·free ↔ 소유권과 Drop"
chats:
- q: "Rust는 뭐가 달라요?"
  a: "실행 중에 메모리를 치우는 청소부 없이, 컴파일러가 메모리 실수를 미리 막아요. 대신 배우기 어렵고 컴파일이 느려요."
  link: /studies/rust/why-rust/
  link_label: "Rust가 푸는 문제"
  next:
  - q: "C에서는 어떤 실수가 나요?"
    a: "길이 3인 배열의 10번 칸을 읽으면 C는 아무 값이나 읽어 와요. Rust는 그 자리에서 멈춰요."
    link: /studies/rust/why-rust/
    link_label: "Rust가 푸는 문제"
  - q: "빌린다는 게 뭐예요?"
    a: "주인은 그대로 두고 잠깐 쓰는 거예요. 여럿이 함께 읽거나, 한 명만 고치거나 둘 중 하나만 돼요."
    link: /studies/rust/borrowing-references/
    link_label: "빌림과 참조"
- q: "스레드는 안전해요?"
  a: "같은 값을 잠금 없이 동시에 고치는 일은 컴파일할 때 막아요. 그래도 교착상태나 순서에 따라 결과가 바뀌는 버그는 못 막아요."
  link: /studies/rust/threads-send-sync/
  link_label: "스레드와 Send·Sync"
  next:
  - q: "Rc를 스레드로 넘기면요?"
    a: "컴파일이 안 돼요. Rc는 개수를 세는 방식이 스레드에 안전하지 않아서 Send가 아니에요. 스레드끼리는 Arc를 써요."
    link: /studies/rust/rc-arc-weak/
    link_label: "Rc·Arc·Weak"
- q: "async fn은 부르면 바로 돌아요?"
  a: "아니에요. 부르기만 하면 '나중에 결과를 줄 값'만 생기고, `.await`하거나 런타임에 맡겨야 움직여요."
  link: /studies/rust/futures-async-await/
  link_label: "Future와 async·await"
  next:
  - q: "그럼 취소는 어떻게 해요?"
    a: "그 값을 버리면 끝이에요. 그래서 어느 `.await`에서 멈춰도 데이터를 잃지 않게 짜야 해요."
    link: /studies/rust/cancellation-timeouts-select/
    link_label: "취소·타임아웃·select"
talk:
- text: "실행 중에 255인 `u8`에 1을 더하면 개발용 빌드에서는 멈추고, 배포용 빌드에서는 조용히 0으로 돌아가요. 컴파일러가 미리 아는 값이면 아예 컴파일이 안 돼요."
  link: /studies/rust/values-variables-types/
  link_label: "값·변수·타입"
- text: "`&dyn Shape`는 보통 참조의 두 배 크기예요. 주소 옆에 메서드 표(vtable)의 주소를 하나 더 들고 다녀요."
  link: /studies/rust/trait-objects/
  link_label: "트레이트 객체"
- text: "서버를 끌 때는 새 요청을 막고, 정해 둔 시간 안에 하던 일을 마치고, 로그를 비운 다음에 끝내요."
  link: /studies/rust/graceful-shutdown/
  link_label: "안전한 종료"
- text: "사용자 입력을 `format!`으로 SQL 문장에 붙이면 안 돼요. 값은 따로 실어 보내야 주입 공격을 막아요."
  link: /studies/rust/sqlx-database/
  link_label: "sqlx로 데이터베이스 쓰기"
