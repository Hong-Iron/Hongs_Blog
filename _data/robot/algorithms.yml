# 홍철's lines for the algorithms course pages. Format: _data/robot/README.md
greeting:
- "알고리즘이에요. 프로그래머스 문제 풀면서 정리했어요. 코드는 다 파이썬이에요."
- "알고리즘 페이지예요. 내릴수록 배경 막대가 정렬돼요."
- "여긴 알고리즘이에요. 코딩 테스트 준비하세요?"
- "알고리즘 노트예요. 문제 풀이랑 코드가 잔뜩 있어요."
questions:
- q: "뭐부터 보면 돼요?"
  a: "파이썬 기본기, 구현, 자료구조, 탐색, 그래프와 트리, DP, 고급 기법 순서예요. 다익스트라까지도 6단계라서 문제 풀면서 금방 올라가요."
  link: /studies/algorithms/
  link_label: 로드맵
- q: 어려워요?
  a: "개념보다 '이 문제 무슨 기법이지?'를 알아보는 게 어려워요. 그래서 기법 문서에 '이런 말이 보이면 이 기법' 같은 신호를 적어 뒀어요."
- q: "배워서 어디에 써요?"
  a: "코딩 테스트에 바로 써요. 입력 크기만 보고 쓸 수 있는 방법을 미리 고르는 '시간 복잡도 어림'은 모든 풀이에서 제일 먼저 해요."
  link: /studies/algorithms/complexity-budget/
  link_label: "시간 복잡도로 방법 고르기"
- q: "제일 중요한 건 뭐예요?"
  a: "'리스트와 문자열'이요. 문서 11개가 이걸 깔고 있어요. 그다음이 시간 복잡도 어림이고요."
  link: /studies/algorithms/list-string/
  link_label: "리스트와 문자열"
- q: "다른 과목이랑도 이어져요?"
  a: "공학수학이랑 브리지 문서 일곱 개로 이어져요. 귀납법이 루프 불변식이고, 누적 합이 아래삼각행렬 곱이에요."
  link: /studies/algorithms/prefix-sum-triangular/
  link_label: "누적 합 ↔ 아래삼각행렬"
chats:
- q: "알고리즘은 어떻게 공부했어요?"
  a: "프로그래머스 문제를 풀면서 거기 필요한 개념을 하나씩 정리했어요. 풀이마다 파이썬 코드가 붙어 있어요."
  link: /studies/algorithms/
  link_label: 로드맵
  next:
  - q: "어디서부터 보면 돼요?"
    a: "'시간 복잡도로 방법 고르기'요. 입력 크기를 보면 쓸 수 있는 알고리즘이 거의 정해져요."
    link: /studies/algorithms/complexity-budget/
    link_label: "시간 복잡도로 방법 고르기"
    next:
    - q: "어떻게 정해져요?"
      a: "대충 파이썬은 1초에 천만 번 정도 계산한다고 잡아요. n이 10만이면 O(n²)은 100억 번이라 안 되고, O(n log n)은 200만 번 정도라 넉넉해요."
  - q: "파이썬으로 해도 돼요?"
    a: "돼요. 대신 반복문이 느리니까 딕셔너리, 집합, 정렬 같은 내장 기능을 잘 써야 해요."
    link: /studies/algorithms/python-basics/
    link_label: "파이썬 기본 문법"
- q: "BFS랑 DFS는 언제 써요?"
  a: "가중치 없는 그래프에서 최단 거리는 BFS예요. 가까운 곳부터 퍼지거든요. 모든 경우를 끝까지 파고들 땐 DFS나 백트래킹이요."
  link: /studies/algorithms/bfs/
  link_label: BFS
  next:
  - q: "DFS는 어떻게 짜요?"
    a: "재귀로 짜면 짧아요. 다만 파이썬은 재귀 깊이 제한이 있어서, 깊어지면 스택으로 직접 짜는 게 안전해요."
    link: /studies/algorithms/dfs/
    link_label: DFS
  - q: 백트래킹은요?
    a: "DFS로 하나씩 골라 보다가, 더 가 봐야 답이 안 나오는 길은 일찍 되돌아오는 거예요."
    link: /studies/algorithms/recursion-backtracking/
    link_label: "재귀와 백트래킹"
- q: 다익스트라는요?
  a: "가장 가까운 곳부터 거리를 확정해 나가요. 단, 간선 가중치가 음수가 아닐 때만 맞아요."
  link: /studies/algorithms/dijkstra/
  link_label: 다익스트라
  next:
  - q: "음수 간선이 있으면요?"
    a: "벨만-포드나 플로이드–워셜을 써요. 플로이드–워셜은 모든 점 쌍의 최단 거리를 O(n³)에 구해요."
    link: /studies/algorithms/floyd-warshall/
    link_label: 플로이드–워셜
  - q: "왜 음수면 안 돼요?"
    a: "한번 확정한 거리가 나중에 음수 간선을 타고 더 짧아질 수 있거든요. '가까운 것부터 확정'이라는 전제가 깨져요."
  - q: "구현할 때 뭐가 필요해요?"
    a: "우선순위 큐(힙)요. 아직 확정 안 된 곳 중 제일 가까운 걸 빨리 꺼내야 해서요."
    link: /studies/algorithms/heap/
    link_label: "힙과 우선순위 큐"
- q: "DP가 너무 어려워요"
  a: "큰 문제를 작은 문제로 쪼개고, 같은 작은 문제는 한 번만 풀어서 적어 두는 거예요. 점화식이 보이면 반은 끝났어요."
  link: /studies/algorithms/dynamic-programming/
  link_label: "동적 계획법"
  next:
  - q: "그리디랑 뭐가 달라요?"
    a: "그리디는 매번 지금 제일 좋아 보이는 걸 고르고 뒤돌아보지 않아요. 그게 전체 최적이라는 증명이 있을 때만 써요."
    link: /studies/algorithms/greedy/
    link_label: 그리디
  - q: "점화식은 어떻게 찾아요?"
    a: "'마지막에 무엇을 했나'로 경우를 나눠 보세요. 마지막 선택을 빼면 남는 게 더 작은 같은 문제예요."
  - q: "DP 종류도 있어요?"
    a: "구간 DP, 트리 DP 같은 게 있어요. 계산 순서가 위상 정렬이랑 같다는 브리지 문서도 있어요."
    link: /studies/algorithms/toposort-dp-order/
    link_label: "위상 정렬 ↔ 동적 계획법"
- q: "이분 탐색에서 자꾸 틀려요"
  a: "범위 끝을 포함하는지, 반복 조건이 lo < hi인지 lo <= hi인지 하나로 정해 두고 끝까지 지키세요."
  link: /studies/algorithms/binary-search/
  link_label: "이분 탐색"
  next:
  - q: "매개변수 탐색은요?"
    a: "'답이 x 이하일 수 있나?'라는 예/아니오 질문으로 바꿔서, 예와 아니오가 갈리는 경계를 이분 탐색해요."
    link: /studies/algorithms/parametric-search/
    link_label: "매개변수 탐색"
    next:
    - q: "수학이랑도 이어져요?"
      a: "사잇값 정리랑 같은 구조예요. 연속 함수 대신 예/아니오가 한 번만 바뀌는 조건을 쓰는 거예요."
      link: /studies/algorithms/parametric-search-ivt/
      link_label: "매개변수 탐색 ↔ 사잇값 정리"
- q: "자료구조는 뭐부터요?"
  a: "딕셔너리랑 집합이요. 찾기를 평균 O(1)에 해 줘서 시간 초과의 대부분이 이걸로 풀려요."
  link: /studies/algorithms/hash-dict-set/
  link_label: "딕셔너리와 집합"
  next:
  - q: "힙은 언제 써요?"
    a: "제일 작은(또는 큰) 걸 계속 꺼내야 할 때요. 파이썬 heapq는 최소 힙이라, 최대 힙은 값에 마이너스를 붙여요."
    link: /studies/algorithms/heap/
    link_label: "힙과 우선순위 큐"
  - q: "스택이랑 큐는요?"
    a: "스택은 마지막에 넣은 걸 먼저, 큐는 먼저 넣은 걸 먼저 꺼내요. 괄호 짝 맞추기는 스택, BFS는 큐예요."
    link: /studies/algorithms/stack/
    link_label: 스택
  - q: "유니온 파인드는요?"
    a: "같은 그룹인지 빠르게 확인하고 합치는 구조예요. 최소 신장 트리 만들 때 사이클 검사에 써요."
    link: /studies/algorithms/union-find/
    link_label: "유니온 파인드"
- q: "투 포인터가 뭐예요?"
  a: "배열 양쪽이나 같은 쪽에 손가락 두 개를 두고, 조건에 따라 하나씩 움직여요. O(n²)을 O(n)으로 줄여 줘요."
  link: /studies/algorithms/two-pointers/
  link_label: "투 포인터와 슬라이딩 윈도"
  next:
  - q: "누적 합이랑 같이 써요?"
    a: "자주요. 구간 합을 매번 더하지 않고 누적 합 두 개의 차로 바로 구해요."
    link: /studies/algorithms/prefix-sum/
    link_label: "누적 합과 차분 배열"
- q: "코딩 테스트 팁 있어요?"
  a: "입력 크기부터 보세요. 그리고 예시를 손으로 한 번 따라가 보고 나서 코드를 짜요."
  next:
  - q: "구현 문제는 어떻게 해요?"
    a: "문제에 적힌 규칙을 그대로 옮기되, 좌표나 방향은 배열로 만들어 두면 실수가 확 줄어요."
    link: /studies/algorithms/simulation/
    link_label: "구현과 시뮬레이션"
  - q: "시간 계산 문제는요?"
    a: "전부 분이나 초로 바꿔서 계산하고, 출력할 때만 다시 시:분으로 돌리세요."
    link: /studies/algorithms/time-conversion/
    link_label: "시간·날짜 계산"
- q: "브리지 문서가 뭐예요?"
  a: "알고리즘이랑 공학수학을 잇는 문서예요. 귀납법↔루프 불변식, 누적 합↔아래삼각행렬 같은 거요. 일곱 개 있어요."
  link: /studies/algorithms/induction-loop-invariant/
  link_label: "귀납법 ↔ 루프 불변식"
  next:
  - q: "루프 불변식이 뭐예요?"
    a: "반복문이 한 바퀴 돌 때마다 계속 맞는 성질이에요. 시작할 때 맞고, 한 바퀴 돌아도 맞으면, 끝날 때도 맞아요. 귀납법이랑 똑같은 구조예요."
talk:
- text: "코드 줄이 짧다고 빠른 건 아니에요. 리스트에 쓴 in은 한 줄인데, 재 보니 집합보다 1,000배쯤 느렸어요."
  link: /studies/algorithms/complexity-budget/
  link_label: "시간 복잡도로 방법 고르기"
- text: "파이썬 딕셔너리는 3.7부터 넣은 순서대로 돌아요. 집합은 아직 순서 약속이 없고요."
  link: /studies/algorithms/hash-dict-set/
  link_label: "딕셔너리와 집합"
- text: "재귀로 리스트를 넘기면 복사되는 게 아니라 같은 걸 가리켜요. append한 건 꼭 pop으로 돌려놔야 해요."
  link: /studies/algorithms/recursion-backtracking/
  link_label: "재귀와 백트래킹"
- text: "이분 탐색에서 lo = mid로 두면 무한 루프에 빠질 수 있어요. 마지막 두 칸에서 안 줄어들거든요."
  link: /studies/algorithms/binary-search/
  link_label: "이분 탐색"
- text: "이분 탐색이 꼭 정렬된 배열에서만 되는 건 아니에요. 답이 '아니오…아니오, 예…예' 모양이면 돼요."
  link: /studies/algorithms/parametric-search/
  link_label: "매개변수 탐색"
- text: "그리디는 예시 몇 개 맞았다고 믿으면 안 돼요. 회의실 배정도 '먼저 끝나는 것'만 늘 맞아요."
  link: /studies/algorithms/greedy/
  link_label: 그리디
- text: "BFS에선 큐에 넣을 때 방문 표시를 해야 해요. 꺼낼 때 하면 같은 칸이 여러 번 들어가요."
  link: /studies/algorithms/bfs/
  link_label: "너비 우선 탐색"
- text: "다익스트라는 처음 발견했을 때 확정하면 안 돼요. 힙에서 꺼낼 때 확정해요."
  link: /studies/algorithms/dijkstra/
  link_label: 다익스트라
- text: "메모이제이션이 만능은 아니에요. 같은 부분 문제가 다시 나와야 이득이에요."
  link: /studies/algorithms/dynamic-programming/
  link_label: "동적 계획법"
- text: "기울기를 나눗셈으로 비교하면 세로선에서 터져요. 외적을 쓰면 깔끔해요."
  link: /studies/algorithms/geometry-ccw/
  link_label: "계산 기하 기초"
- text: "파이썬 sort는 안정 정렬이에요. 같은 값끼리는 원래 순서가 그대로 남아요."
  link: /studies/algorithms/sorting/
  link_label: "정렬과 정렬 기준"
- text: "트라이는 단어를 글자 하나씩 가지로 저장하는 나무예요. 자동 완성에 딱이에요."
  link: /studies/algorithms/trie/
  link_label: 트라이
- text: "비트마스크로 집합을 정수 하나에 담을 수 있어요. 원소가 20개면 2의 20제곱, 약 100만 가지 부분집합이에요."
  link: /studies/algorithms/bit-operations/
  link_label: "비트 연산과 비트마스크"
- text: "최소 신장 트리는 크루스칼이나 프림으로 만들어요. 둘 다 그리디이고, 만든 트리의 총 무게는 같아요."
  link: /studies/algorithms/mst/
  link_label: "최소 신장 트리"
- text: "세 점이 시계 방향인지 반시계 방향인지는 외적 부호 하나로 알 수 있어요."
  link: /studies/algorithms/geometry-ccw/
  link_label: "계산 기하 기초"
