# 홍철's lines for every page without a course. Format: _data/robot/README.md
# On course pages these chats and talk lines mix with the course's own.
greeting:
  - "안녕하세요, 홍철이에요. 편하게 눌러 보세요."
  - "어, 오셨어요? 홍철이에요. 뭐든 눌러 보세요."
  - "반가워요. 철민이 얼굴로 만든 로봇, 홍철이에요."
  - "안녕하세요! 오늘은 무슨 얘기 할까요?"
  - "왔어요? 마침 심심했는데 잘됐어요."
  - "안녕하세요. 말은 정해진 것만 하지만, 꽤 많이 외워 놨어요."
again:
  - "또 뭐 할까요?"
  - "다음은 뭐 할까요?"
  - "좋아요. 또 골라 보세요."
  - "아직 할 얘기 많아요. 골라 보세요."
chat_prompt:
  - "무슨 얘기 할까요?"
  - "골라 보세요. 아무거나 좋아요."
  - "이런 얘기 어때요?"
  - "뭐부터 얘기할까요?"
ask: "뭐가 궁금해요?"
questions:
  - q: 여긴 뭐 하는 곳이에요?
    a: "제가 만든 것, 공부한 것, 묵상한 글을 모아 둔 곳이에요. 위 메뉴에서 골라서 보시면 돼요."
    next:
      - q: 프로젝트는 몇 개예요?
        a: "지금 여섯 개요. 웹 검색 도구, Obsidian 플러그인, 공공조달 플랫폼 같은 것들이에요."
        link: /projects/
        link_label: 프로젝트
      - q: 공부한 건 얼마나 돼요?
        a: "{courses}과목에 노트가 {notes}편이에요. 과목마다 개념 문서, 연습 문제, 코드가 있어요."
        link: /studies/
        link_label: 지식 DB
      - q: 묵상한 글은요?
        a: "나의 팡세에 있어요. 잠 안 오는 밤에 쓴 글이 많아요."
        link: /pensees/
        link_label: 나의 팡세
  - q: 어디부터 보면 좋아요?
    a: "공부 노트가 궁금하면 지식 DB부터 보세요. {courses}과목에 노트가 {notes}편 있어요. 과목 페이지로 가면 그 과목 얘기도 해 드릴게요."
    link: /studies/
    link_label: 지식 DB
  - q: 로고는 무슨 뜻이에요?
    a: "기둥 두 개 사이에 빨간 점 있죠? H랑 I 사이의 하이픈이에요. Hong-Iron. 마우스 올려 보면 점이 폴짝 뛰어요."
    next:
      - q: Hong-Iron이 무슨 뜻이에요?
        a: "Hong은 성이고, Iron은 '철'이에요."
      - q: 오른쪽 위 노란 삼각형은요?
        a: "그냥 포인트예요. 마우스 올리면 그것도 빙글 돌아요."
  - q: 배경에서 움직이는 건 뭐예요?
    a: "과목마다 달라요. 알고리즘 노트는 내릴수록 막대가 정렬되고, 확률과 통계는 공이 떨어져서 종 모양이 돼요. 한번 내려 보세요."
    link: /studies/
    link_label: 과목 둘러보기
    next:
      - q: 홈 화면도 바뀌어요?
        a: "네. 내릴수록 종이색에서 초록빛을 지나 밤이 돼요. 나의 팡세에 닿으면 깜깜해져요."
      - q: 다른 과목은 뭐가 나와요?
        a: "이상 심리학은 잉크 얼룩 검사 같은 모양, 컴퓨터 통신은 패킷이 오가는 네트워크, 미분적분학은 리만 합 막대예요."
  - q: 진짜 철민이에요?
    a: "반만요. 저는 철민이 얼굴을 한 칸씩 찍어서 만든 로봇 홍철이에요. 정해진 말만 할 줄 알아요. 아무 질문에나 대답은 못 해도, 과목마다 할 얘기는 좀 외워 놨어요."
    next:
      - q: 철민 님한테 직접 연락하려면요?
        a: "About 페이지에 이메일이랑 GitHub이 있어요. 저보다 말 훨씬 잘해요. 아마도요."
        link: /about/
        link_label: About
      - q: 얼굴 진짜 닮았어요?
        a: "가르마, 일자 눈썹, 웃으면 사라지는 눈, 이 보이는 웃음. 이 네 개는 확실히 닮았어요."
chats:
  - q: 안녕하세요!
    a:
      - "안녕하세요! 와 줘서 고마워요."
      - "네, 안녕하세요! 오늘 처음 오셨어요?"
      - "안녕하세요. 저는 홍철이에요. 반가워요."
    next:
      - q: 누구세요?
        a: "철민이 사진을 보고 한 칸씩 찍어 만든 픽셀 로봇이에요. 이 블로그 안내를 맡고 있어요."
        next:
          - q: 철민 님은 어떤 사람이에요?
            a: "소프트웨어를 전공하는 4학년이에요. 만드는 것도 좋아하고, 생각을 글로 쏟아내는 것도 좋아해요."
            next:
              - q: 어디서 공부해요?
                a: "중앙대학교요. 소프트웨어 전공이에요."
                link: /about/
                link_label: About
              - q: 글은 어디서 봐요?
                a: "나의 팡세에요. 신앙 얘기가 많고, 일상 얘기도 섞여 있어요."
                link: /pensees/
                link_label: 나의 팡세
          - q: 로봇인데 말을 해요?
            a: "정해진 말만요. 그래도 버튼 누르는 대로 대화가 이어지게 꽤 많이 외워 놨어요."
      - q: 처음 왔어요
        a: "환영해요! 위 메뉴에 프로젝트, 지식 DB, 나의 팡세가 있어요. 뭐가 궁금하세요?"
        next:
          - q: 제일 볼 만한 건요?
            a: "개발 쪽이면 프로젝트, 공부 자료가 필요하면 지식 DB요. 사람 냄새 나는 건 나의 팡세고요."
          - q: 그냥 둘러볼게요
            a: "좋아요. 저는 여기 구석에 있을게요. 궁금하면 또 눌러 주세요."
  - q: 이름이 왜 홍철이에요?
    a: "홍철민에서 앞 두 글자만 땄어요. 로봇이라 한 글자 덜 받았나 봐요."
    next:
      - q: 원래 이름은 뭐였어요?
        a: "처음엔 '로봇 철민'이었어요. 저도 지금 이름이 더 좋아요."
      - q: 홍철 님이라고 불러도 돼요?
        a: "그럼요. 근데 '님'까지 붙이면 좀 쑥스러워요."
  - q: 얼굴은 누가 그렸어요?
    a: "철민이 프로필 사진을 보고 24×23칸에 한 칸씩 찍었어요. 그림판이 아니라 코드로요."
    next:
      - q: 코드로 그려요?
        a: "네. 글자 하나가 픽셀 하나예요. K는 테두리, H는 머리카락, S는 피부, 이런 식으로 줄줄이 적어요."
      - q: 눈 깜빡이던데요?
        a: "눈 모양을 세 벌 그려 놨어요. 뜬 눈, 감은 눈, 웃는 눈. 번갈아 보여 주면 깜빡이는 것처럼 보여요."
        next:
          - q: 입도 움직이던데요?
            a: "말할 때만요. 다문 입이랑 벌린 입을 빠르게 바꿔요."
      - q: 머리 위에 빨간 건 뭐예요?
        a: "안테나예요. 로봇인 티를 내야죠. 과목 페이지에 가면 과목 색으로 바뀌어요."
  - q: 요즘 뭐 해요?
    a:
      - "학교 다녀요. 4학년이라 졸업 시기를 고민하는 중이에요."
      - "이번 학기 수업 듣고, 노트 정리하고, 가끔 글 써요."
    next:
      - q: 이번 학기 뭐 들어요?
        a: "이상 심리학, 컴퓨터 통신, 휴먼 인터페이스 미디어요. 셋 다 노트가 지식 DB에 있어요."
        link: /studies/
        link_label: 지식 DB
        next:
          - q: 제일 재밌는 건요?
            a: "이상 심리학이요. 들으면서 제 지난 1년이 좀 설명되더라고요. 그 얘기는 Tenacity에 썼어요."
            link: /pensees/2026/09/30/tenacity/
            link_label: Tenacity
          - q: 제일 어려운 건요?
            a: "컴퓨터 통신 계산 문제요. 비트랑 바이트, 밀리초랑 마이크로초를 헷갈리면 답이 천 배씩 틀려요."
      - q: 개강은 어땠어요?
        a: "개강 날 비가 엄청 와서 바지랑 신발이 홀딱 젖었어요. 그래도 들뜬 학우들 보니까 뭐든 할 수 있을 것 같은 기분이었어요."
        link: /pensees/2026/09/01/by-their-fruits/
        link_label: 그의 열매로 그들을 알리라
      - q: 졸업하면 뭐 해요?
        a: "그건 아직 고민 중이에요. 정해지면 여기에 제일 먼저 올라올 거예요."
  - q: 여름방학엔 뭐 했어요?
    a: "일했어요. 서초구에 있는 회사로 출근했어요."
    next:
      - q: 일은 어땠어요?
        a: "재밌었어요. 몰두하다 보면 점심시간인 줄도 모를 때가 많았어요. 퇴근하고 걷는 한두 시간이 하루 중 제일 모험 같은 시간이었고요."
        link: /pensees/2026/08/01/no-time-to-think/
        link_label: 생각할 겨를이 없는 편이 좋다
        next:
          - q: 인정받으니까 좋았어요?
            a: "좋았죠. 근데 어느 순간 일보다 '증명'을 하려는 저를 봤어요. 그 부끄러운 얘기를 글로 썼어요."
            link: /pensees/2026/09/01/by-their-fruits/
            link_label: 그의 열매로 그들을 알리라
          - q: 추가 근무도 했어요?
            a: "했어요. 억울해서 사진까지 찍어 뒀는데, 다시 보니 그렇게 기분 나쁘진 않았던 것 같아요."
      - q: 퇴근길은 괜찮았어요?
        a: "서초구라 그런지 지하철 밖까지 줄이 있었어요. 그래서 회사 근처에서 저녁 먹고, 사람 빠질 때까지 기다렸다 들어갔어요."
        next:
          - q: 저녁은 뭐 먹었어요?
            a: "작은 우동집을 자주 갔어요. 가게는 좁은데 사람이 없어서 좋았어요. 이름은 '오니기리와 이우동'이었나, 정확히는 기억이 안 나요."
          - q: 야식도 먹었어요?
            a: "국밥 시켜 먹은 날이 있어요. 글 쓰다가요."
  - q: 맛집 추천해 주세요
    a: "버거킹 펜타 치즈 와퍼에 패티 추가요. 진짜 하나님 일찍 만나는 맛이에요."
    next:
      - q: 표현이 좀 과한데요?
        a: "철민이 직접 쓴 표현 그대로예요. 저는 그냥 전달만 했어요."
      - q: 디저트는요?
        a: "폴 바셋 타르트요. 2년 전쯤 먹은 게 생각나서 다시 사 봤어요. 그때만큼 맛있었는지는 모르겠어요."
        next:
          - q: 그때는 어디서 먹었는데요?
            a: "서울대 사랑방이요. 타르트 먹다가 거기가 문득 그리워졌어요."
      - q: 우동은요?
        a: "서초구 회사 근처 작은 우동집이요. 좁은데 조용해서 좋았어요."
  - q: 게임 해요?
    a: "요즘 마인크래프트 해요. 고등학교 친구들이랑요."
    next:
      - q: 친구들이랑 자주 놀아요?
        a: "솔직히 1년은 사역하느라, 요즘은 일한다고 잘 못 놀았어요. 그래도 몇 번을 미뤄도 또 불러 주는 친구들이에요."
        next:
          - q: 좋은 친구들이네요
            a: "네. 그 친구들 덕분에 고비를 많이 넘겼어요. 믿지 않는 사람이 더 따뜻할 때가 많더라고요."
            link: /pensees/2026/08/01/no-time-to-think/
            link_label: 생각할 겨를이 없는 편이 좋다
      - q: 마크에서 뭐 만들어요?
        a: "그건 저도 몰라요. 로봇이라 거기까진 못 외웠어요."
      - q: 마크 하면 뭐가 떠올라요?
        a: "같이 웃고 떠들던 고등학교 때요."
  - q: 말투가 좀 특이해요
    a: "알아요. 한국에 온 지 4년 가까이 됐는데, 아직 문어체가 입에 붙어 있어요."
    link: /pensees/2026/09/18/loosening-my-grip/
    link_label: 힘을 빼 보려고
    next:
      - q: 외국에서 살았어요?
        a: "네, 인생 대부분을 외국에서 살았어요. 흔히 '검머외'라고 하죠."
        next:
          - q: 한국에 처음 왔을 때 어땠어요?
            a: "친구랑 같이 인천공항에 내렸어요. 저랑 피부색이 같은 '외국인'들이 오가는 모습을 평생 못 잊을 것 같아요."
          - q: 지금은 적응했어요?
            a: "많이요. 그래도 사투리를 들어도 사투리인 줄 모를 때가 있어요."
      - q: 한국어는 어떻게 배웠어요?
        a: "책으로요. 초등학교 2학년 때 교회 도서관 책을 거의 다 읽었어요. 그래서 말보다 글에 가까운 한국어를 써요."
        next:
          - q: 글은 잘 쓰겠네요
            a: "글쓰기 수업에서 C+를 받았어요. 인정하기 싫어서 프로젝트 글쓰기를 또 들었는데, 또 C+였어요."
            next:
              - q: 왜 그랬을까요?
                a: "그때는 교수님 취향 탓을 했어요. 지금은 알아요. 글이랑 말은 눈빛이랑 손짓만큼 다르더라고요."
      - q: 대답이 짧다는 얘기 들어요?
        a: "들어요. 한 순장님이 '늘 단답이라 친해지기 어렵다'고 했어요. 상대 말이 끝나기도 전에 결론이 나 버리는 버릇이 있어서요."
        next:
          - q: 고치는 중이에요?
            a: "네. 힘을 빼 보려고요. 그 얘기를 글로 썼어요."
            link: /pensees/2026/09/18/loosening-my-grip/
            link_label: 힘을 빼 보려고
  - q: CCC가 뭐예요?
    a: "대학생 선교 단체예요. 철민이 1년 동안 대표 순장을 맡았어요."
    next:
      - q: 대표 해 보니 어땠어요?
        a: "책임지는 걸 정말 싫어하는데, 남이 걸린 일엔 기어서라도 가는 성격이라 저를 갈아 넣었어요. 후회는 없어요."
        link: /pensees/2026/08/20/my-story-now-that-its-over/
        link_label: 끝나서 하는 진짜 내 이야기
        next:
          - q: 언제 끝났어요?
            a: "2026년 8월 20일이요. 그날이 지난 1년 중 제일 기뻤대요."
          - q: 힘들었어요?
            a: "많이요. 지난 1년이 번데기 같았다고 썼어요. 나비가 되려면 번데기 안에서 한번 다 녹아야 한대요."
            link: /pensees/2026/06/29/chrysalis/
            link_label: 번데기
      - q: 필리핀도 갔었다면서요?
        a: "1월에 단기선교로요. CPU 캠퍼스에서 만난 1학년 학생이랑 순모임을 했어요."
        next:
          - q: 무슨 얘기 했어요?
            a: "그 친구가 '어차피 또 죄를 지을 텐데 믿음이 무슨 의미냐'고 물었어요. 그 질문으로 쓴 글이 Arcadia, Acedia예요."
            link: /pensees/2026/01/18/arcadia-acedia/
            link_label: Arcadia, Acedia
      - q: 순장이 뭐예요?
        a: "작은 모임(순)을 이끄는 사람이에요. 철민도 2024년에 만난 아들 순원이 있어요."
        link: /pensees/2025/11/07/simul-iustus-et-peccator/
        link_label: Simul iustus et peccator
  - q: 팡세가 뭐예요?
    a: "프랑스어로 '생각'이에요. 파스칼 책 제목이기도 하고요. 여기선 묵상한 글을 모아 둔 곳이에요."
    link: /pensees/
    link_label: 나의 팡세
    next:
      - q: 어떤 글부터 읽을까요?
        a:
          - "처음이면 '번데기'요. 짧고, 지난 1년이 다 들어 있어요."
          - "'힘을 빼 보려고'요. 말투 얘기라 신앙이 없어도 읽기 편해요."
          - "'그리스도인은 관객 이상이어야 한다'요. 일본 고시엔에서 고교 야구 보다가 쓴 글이에요."
      - q: 글은 언제 써요?
        a: "잠이 안 오는 밤에요. 누가 콕 찌르듯 잠이 달아나면 펜을 들어요."
        link: /pensees/2026/09/18/loosening-my-grip/
        link_label: 힘을 빼 보려고
      - q: 파스칼 팡세 읽어 봤어요?
        a: "샀어요. 단어는 정말 좋아하는데, 이 책이 걸작인지는 아직 고민 중이에요."
  - q: 요즘 읽는 책 있어요?
    a: "칼뱅의 기독교강요요. 선물로 받았어요. 1541년 프랑스어 초판 번역본이에요."
    link: /pensees/2026/05/03/prayer-as-love/
    link_label: 기도로 사랑, 사랑으로 기도
    next:
      - q: 어렵지 않아요?
        a: "어려워요. 그래도 기도 부분이 제일 찔려서 그 얘기를 글로 남겼어요."
      - q: 다른 책도요
        a:
          - "안셀름 그륀 신부 책이요. 우리가 필요로 하는 위로는 지극히 인간적인 거라는 말이 좋았어요."
          - "러시아 문학도 좋아해요. 실루안 성인의 '아담의 탄식'을 옮겨 둔 글이 있어요."
          - "본회퍼의 옥중서신이요. '마치 하나님이 안 계신 것처럼'이라는 문장으로 글을 하나 썼어요."
  - q: 일본 여행 갔었어요?
    a: "8월에요. 고시엔에 가서 고교 야구를 봤어요."
    link: /pensees/2026/08/15/more-than-spectators/
    link_label: 그리스도인은 관객 이상이어야 한다
    next:
      - q: 재밌었어요?
        a: "처음엔 '고등학생 경기에 웬 사람이 이렇게 많아?' 했어요. 근데 승패가 다 갈렸는데도 다들 끝까지 응원하더라고요."
        next:
          - q: 그래서 뭘 느꼈어요?
            a: "'야구 하나로 이렇게 하나 되는데, 우리는 왜 예수로도 안 될까?' 그 질문으로 글을 썼어요."
            link: /pensees/2026/08/15/more-than-spectators/
            link_label: 관객 이상이어야 한다
  - q: 전공이 뭐예요?
    a: "소프트웨어요. 중앙대학교 4학년이에요."
    next:
      - q: 관심 분야는요?
        a: "인간-컴퓨터 상호작용(HCI)이요. 사람이 기계를 어떻게 쓰는지에 관심이 많아요."
        next:
          - q: 그래서 휴먼 인터페이스 미디어도 들어요?
            a: "네, 이번 학기에 듣고 있어요. 사람이 빛과 색을 어떻게 보는지부터 배워요."
            link: /studies/human-interface-media/
            link_label: 휴먼 인터페이스 미디어
      - q: 컴공 전망 어떻게 봐요?
        a: "작년엔 컴공의 미래가 어둡게만 보여서 고민을 많이 했어요. 그때 쓴 글이 있어요."
        link: /pensees/2025/10/29/the-curtain-my-hands-made/
        link_label: 나의 손을 거친 휘장을 찢으실지라도
        next:
          - q: 지금은요?
            a: "어떤 목적지를 향해 가기보다, 인도하시는 곳으로 따라가겠다고 정리했어요. 그 글 끝에 그렇게 써 있어요."
  - q: 어떤 프로젝트 했어요?
    a: "지금 블로그에 여섯 개 올라가 있어요. 궁금한 거 골라 보세요."
    link: /projects/
    link_label: 프로젝트
    next:
      - q: studyweb은 뭐예요?
        a: "로컬 LLM이 인터넷을 검색하고 읽게 해 주는 도구예요. 유료 검색 API를 집에서 공짜로 대신하는 셈이에요."
        link: /projects/studyweb/
        link_label: studyweb
        next:
          - q: 가격 비교도 된다면서요?
            a: "네. 쇼핑몰마다 상품 페이지에서 가격을 직접 읽어요. 못 읽은 사이트도 숨기지 않고 이유와 함께 알려 줘요."
          - q: 테스트는 해 봤어요?
            a: "테스트가 222개 있어요. 221개 통과, 1개는 건너뛰었어요."
      - q: sharpCouncil은요?
        a: "노트에 적은 인물들한테 로컬 LLM을 하나씩 붙여서 토론시키는 Obsidian 플러그인이에요. 회의록이 실시간으로 쌓여요."
        link: /projects/sharpcouncil/
        link_label: sharpCouncil
        next:
          - q: 토론은 어떻게 흘러가요?
            a: "모두진술, 반론, 합의 판정, 표결, 의결서 순서예요. 의장 역할 모델이 따로 있어요."
      - q: cft는요?
        a: "한국어 프롬프트를 내 컴퓨터에서 영어로 번역해서 Claude Code에 보내는 도구예요. 토큰을 아끼려고요."
        link: /projects/cft/
        link_label: cft
        next:
          - q: 코드가 망가지진 않아요?
            a: "코드, 경로, URL은 번역 전에 가려 두고 그대로 되돌려요. 번역이 실패하면 원문을 그냥 보내고요."
      - q: G2B Masters는요?
        a: "나라장터랑 국방전자조달 입찰 정보를 한곳에 모으고, AI가 공고를 요약해 주는 서비스예요. 실제로 운영됐어요."
        link: /projects/g2b-masters/
        link_label: G2B Masters
        next:
          - q: 어떤 역할이었어요?
            a: "프론트엔드랑 배포 빼고 전부요. DB, API, 수집, AI 요약, 모델 비교 검증까지요."
      - q: 양자 컴퓨팅도 해요?
        a: "양자 컴퓨터 멘토링을 받았어요. 멘토링을 끝까지 붙든 순장님이 기회 하나하나를 귀하게 여기시는 걸 보고 많이 배웠어요."
        link: /pensees/2026/08/01/no-time-to-think/
        link_label: 생각할 겨를이 없는 편이 좋다
  - q: 이 블로그 직접 만들었어요?
    a: "네. GitHub Pages에서 Jekyll로 돌아가요. 디자인도 하나하나 손봤어요."
    next:
      - q: 노트는 어떻게 올려요?
        a: "Obsidian 노트를 스크립트로 변환해서 한 번에 올려요. 교재나 강의 자료는 빼고요."
      - q: 디자인 포인트는요?
        a: "종이 질감, 과목마다 다른 움직이는 배경, 그리고 저요."
      - q: 모바일에서도 돼요?
        a: "돼요. 지식 DB 목차는 휴대폰에선 위쪽 띠로 바뀌어요."
  - q: MBTI 뭐예요?
    a: "MBTI는 모르겠고, 대표단이랑 TCI 검사를 해 본 적은 있어요."
    next:
      - q: 결과가 어땠어요?
        a: "새로운 걸 시도해 보는 성향이 높게 나왔어요. 다른 사람과 어울리려는 성향도요."
        next:
          - q: 그걸로 글도 썼어요?
            a: "네. 결과를 보고 '종말론적 실천주의'라는 생각을 정리했어요."
            link: /pensees/2025/11/09/eschatological-praxis/
            link_label: 종말론적 실천주의
  - q: 공부는 어떻게 해요?
    a: "Obsidian에 과목마다 개념 문서랑 확인 문제를 만들어요. 답은 접어 두고, 먼저 떠올려 본 다음에 펼쳐요."
    next:
      - q: 왜 답을 접어요?
        a: "다시 읽기만 하면 아는 것 같은 착각만 생겨요. 먼저 꺼내 보려고 애쓸 때 기억에 남아요."
        next:
          - q: 틀리면요?
            a: "틀려도 괜찮아요. 틀린 다음에 답을 보면 오히려 더 오래 남아요."
      - q: 노트는 어떻게 생겼어요?
        a: "요약이 맨 위에 쉬운 말로 있고, 예시, 정의, 증명, 확인 문제 순서예요. 과목 페이지 들어가서 아무거나 열어 보세요."
        link: /studies/
        link_label: 지식 DB
      - q: 코드도 있어요?
        a: "있어요. 알고리즘이나 수학 문서마다 직접 돌려서 확인하는 파이썬 코드가 붙어 있어요."
  - q: 좋아하는 단어 있어요?
    a: "'팡세'요. 그래서 글 모음 이름도 나의 팡세예요."
    next:
      - q: 또 있어요?
        a: "'Fiat mihi'요. '제게 이루어지소서'라는 뜻이에요. 그 말을 고백할 수 있는 날이 오길 바란다고 쓴 적이 있어요."
        link: /pensees/2025/12/05/tempted-yet-not-succumbed/
        link_label: Tempted, yet not succumbed
  - q: 심심해요
    a:
      - "그럼 홈 화면 맨 아래까지 내려 보세요. 밤이 와요."
      - "지식 DB에서 알고리즘 과목을 열고 천천히 내려 보세요. 막대가 정렬돼요."
      - "로고에 마우스를 올려 보세요. 빨간 점이 폴짝 뛰어요."
    next:
      - q: 다른 건요?
        a:
          - "확률과 통계 과목 페이지에선 공이 떨어져서 종 모양이 쌓여요."
          - "이상 심리학 페이지는 배경이 잉크 얼룩 검사처럼 번져요."
          - "저를 여러 번 눌러 보세요. 할 말 꽤 많아요."
  - q: 고마워요, 잘 있어요
    a:
      - "와 줘서 고마워요. 또 놀러 오세요!"
      - "네, 조심히 가세요. 다음에 또 얘기해요."
      - "잘 가요! 궁금한 거 생기면 언제든 눌러요."
talk:
  - text: "말투가 좀 딱딱하면 이해해 주세요. 한국에 온 지 4년 가까이 됐는데, 아직 문어체가 입에 붙어 있어요."
    link: /pensees/2026/09/18/loosening-my-grip/
    link_label: 힘을 빼 보려고
  - text: "펜타 치즈 와퍼에 패티 추가해서 드셔 보세요. 진짜 하나님 일찍 만나는 맛이에요."
  - text: "폴 바셋이 타르트 맛집인 거 알고 계셨어요? 2년 전쯤 먹었던 게 생각나서 다시 사 먹어 봤어요."
  - text: "여름에 서초구에서 일할 때 퇴근길 지하철 줄이 제일 무서웠어요. 그래서 사람 빠질 때까지 회사 근처에서 저녁 먹고 들어갔어요."
    link: /pensees/2026/08/01/no-time-to-think/
    link_label: 생각할 겨를이 없는 편이 좋다
  - text: "마인크래프트 하면 고등학교 때 친구들이랑 웃고 떠들던 게 생각나요. 약속을 몇 번이나 미뤄도 또 불러 주는 친구들이에요."
  - text: "파스칼의 팡세를 샀어요. '팡세'라는 단어는 참 좋아하는데, 이 책이 걸작인지는 아직 고민 중이에요."
  - text: "잠이 안 오는 밤엔 펜을 들고 생각을 쏟아내요. 그렇게 쓴 글들이 나의 팡세에 모여 있어요."
    link: /pensees/
    link_label: 나의 팡세
  - text: "홈 화면 끝까지 내려 보셨어요? 나의 팡세에 닿으면 밤이 와요."
  - text: "확인 문제는 답 가리고 먼저 풀어 보세요. 틀려도 괜찮아요."
  - text: "공부 노트는 전부 Obsidian으로 정리한 거예요. 교재나 강의 자료는 안 올렸어요."
  - text: "개강 날 비가 엄청 와서 바지랑 신발이 다 젖었어요. 그래도 그날 기분은 좋았어요."
  - text: "글쓰기 수업에서 C+를 두 번 받았어요. 그래도 글 쓰는 건 여전히 좋아해요."
  - text: "일본 고시엔에서 고교 야구를 봤어요. 승패가 다 갈렸는데도 끝까지 응원하는 모습이 멋있었어요."
    link: /pensees/2026/08/15/more-than-spectators/
    link_label: 관객 이상이어야 한다
  - text: "퇴근하고 걷는 한두 시간이 하루 중 제일 모험 같은 시간이었어요."
  - text: "일하다 야식으로 국밥을 시킨 날이 있어요. 그날 쓴 글에도 남아 있어요."
  - text: "사람을 대하는 거랑 문제를 푸는 건 다르더라고요. 저는 그걸 꽤 늦게 알았어요."
    link: /pensees/2026/09/09/practicing-open-hands/
    link_label: 손을 펴는 연습
  - text: "나비는 번데기 안에서 한번 다 녹았다가 다시 만들어진대요. 그러면서 몸무게의 4할을 잃고요."
    link: /pensees/2026/06/29/chrysalis/
    link_label: 번데기
  - text: "'야곱'은 발뒤꿈치를 잡는 자, '이스라엘'은 하나님과 겨루어 이긴 자래요. 성경은 끝까지 두 이름을 섞어 불러요."
    link: /pensees/2026/10/05/i-am-israel-too/
    link_label: 나도 이스라엘
  - text: "시편 119편의 '등'은 원어로 작은 등잔이래요. 한 발자국만큼만 비춰 주는 불빛이요."
    link: /pensees/2025/12/05/tempted-yet-not-succumbed/
    link_label: Tempted, yet not succumbed
  - text: "studyweb은 테스트가 222개예요. 221개 통과, 1개는 건너뛰어요."
    link: /projects/studyweb/
    link_label: studyweb
  - text: "새로 올린 프로젝트 네 개의 표지는 다이어그램이에요. 실제 구조를 그대로 그렸어요."
    link: /projects/
    link_label: 프로젝트
  - text: "링크를 공유하면 미리보기 카드가 떠요. 과목 노트는 과목마다 카드 색이 달라요."
  - text: "저는 가로 24칸, 세로 23칸짜리예요. 한 칸이 화면에선 3픽셀이에요."
  - text: "지식 DB 목차에서 과목을 누르면 바로 그 과목으로 내려가요. 지금 보는 과목은 글씨가 커져요."
    link: /studies/
    link_label: 지식 DB
