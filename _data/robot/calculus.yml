# 홍철's lines for the calculus course pages. Format: _data/robot/README.md
greeting:
- "미분적분학이에요. 혼자 공부하면서 정리했어요. 극한에서 시작해서 경사 하강법이랑 푸리에까지 가요."
- "미분적분학 페이지예요. 내릴수록 배경의 리만 합 막대가 촘촘해져요."
- "여긴 미분적분학이에요. 변화를 다루는 수학이에요."
- "미적분 노트예요. 머신러닝이 궁금했다면 여기서 시작하면 돼요."
questions:
- q: "뭐부터 보면 돼요?"
  a: "극한과 연속, 미분, 적분, 급수, 다변수, 최적화, 미분방정식과 푸리에 순서예요. 다변수 들어가기 전에 선형대수의 벡터랑 내적은 보고 오세요."
  link: /studies/calculus/
  link_label: 로드맵
- q: 어려워요?
  a: "앞 단원이 뒤를 계속 받쳐요. 극한에서 테일러 급수까지 11단계로 이어져서, 앞이 약하면 뒤가 무너지는 과목이에요."
- q: "배워서 어디에 써요?"
  a: "머신러닝의 엔진이에요. 경사 하강법도 역전파도 결국 미분이에요. 원시함수를 모르는 적분은 리만 합으로 그냥 계산해요."
  link: /studies/calculus/backprop-bridge/
  link_label: "연쇄 법칙 ↔ 역전파"
- q: "제일 중요한 건 뭐예요?"
  a: "'극한'이랑 '미적분의 기본정리'요. 응용으로 가려면 '연쇄 법칙'은 꼭 잡으세요."
  link: /studies/calculus/chain-rule/
  link_label: "연쇄 법칙"
- q: "다른 과목이랑도 이어져요?"
  a: "합이랑 적분은 이산수학이랑, 사잇값 정리는 알고리즘의 매개변수 탐색이랑 이어져요. 눈이 색을 느끼는 것도 적분으로 써요."
  link: /studies/algorithms/parametric-search-ivt/
  link_label: "매개변수 탐색 ↔ 사잇값 정리"
chats:
- q: "미적분은 왜 배워요?"
  a: "변화를 다루려고요. 미분은 '지금 얼마나 빨리 변하나', 적분은 '다 모으면 얼마나 되나'예요."
  next:
  - q: "컴공에서 어디에 써요?"
    a: "머신러닝이 제일 커요. 경사 하강법으로 오차를 줄이고, 역전파는 연쇄 법칙 그 자체예요."
    link: /studies/calculus/backprop-bridge/
    link_label: "연쇄 법칙 ↔ 역전파"
  - q: "미분이랑 적분은 반대예요?"
    a: "네. 미적분의 기본정리가 그걸 말해요. 모은 걸 다시 미분하면 원래 함수가 나와요."
    link: /studies/calculus/ftc/
    link_label: "미적분의 기본정리"
- q: "경사 하강법이 뭐예요?"
  a: "안개 낀 산에서 발밑 경사가 가장 가파른 아래쪽으로 한 걸음씩 내려가는 거예요."
  link: /studies/calculus/gradient-descent/
  link_label: "경사 하강법"
  next:
  - q: "한 걸음은 얼마나 커요?"
    a: "그게 학습률이에요. 너무 크면 골짜기를 건너뛰어 튀고, 너무 작으면 한참 걸려요."
  - q: "골짜기가 여러 개면요?"
    a: "가까운 골짜기에 갇힐 수 있어요. 볼록 함수면 골짜기가 하나라서 그런 걱정이 없어요."
    link: /studies/calculus/convexity/
    link_label: "볼록 함수와 볼록 최적화"
  - q: "가장 가파른 방향은 어떻게 알아요?"
    a: "그래디언트요. 편미분을 모아 놓은 벡터인데, 그 방향이 가장 가파르게 올라가는 쪽이에요. 그 반대로 가면 내려가요."
    link: /studies/calculus/gradient/
    link_label: "그래디언트와 방향도함수"
- q: "연쇄 법칙은요?"
  a: "겉함수 미분 곱하기 속함수 미분이에요. 톱니바퀴가 맞물려 돌 때 속도가 곱해지는 거랑 같아요."
  link: /studies/calculus/chain-rule/
  link_label: "연쇄 법칙"
  next:
  - q: "역전파랑 같다고요?"
    a: "신경망은 함수를 겹겹이 합성한 거라, 출력 쪽에서부터 연쇄 법칙으로 미분을 곱해 내려와요."
    link: /studies/calculus/backprop-bridge/
    link_label: "연쇄 법칙 ↔ 역전파"
  - q: "변수가 여러 개면요?"
    a: "야코비 행렬로 곱해요. 미분이 숫자 하나에서 행렬로 커질 뿐 원리는 같아요."
    link: /studies/calculus/multivariable-chain-rule/
    link_label: "다변수 연쇄 법칙과 야코비 행렬"
- q: "테일러 급수가 뭐예요?"
  a: "어려운 함수를 한 점 근처에서 다항식으로 흉내 내요. 항을 늘릴수록 더 넓은 범위에서 비슷해져요."
  link: /studies/calculus/taylor-series/
  link_label: "테일러 급수"
  next:
  - q: "그걸 어디에 써요?"
    a: "컴퓨터가 sin이나 eˣ 같은 값을 근사할 때 이런 다항식을 써요. 물리에서 sin θ ≈ θ로 어림하는 것도 테일러 1차 근사예요."
  - q: "선형 근사는요?"
    a: "테일러를 1차에서 자른 거예요. 접선으로 근처 값을 어림해요. 뉴턴 방법은 이걸 되풀이해서 방정식 근을 찾고요."
    link: /studies/calculus/linear-approx-newton/
    link_label: "선형 근사와 뉴턴 방법"
- q: "푸리에 변환은요?"
  a: "복잡한 신호를 여러 사인파의 합으로 풀어요. 소리에 어떤 음이 섞였는지 알 수 있어요."
  link: /studies/calculus/fourier-transform/
  link_label: "푸리에 변환과 합성곱"
  next:
  - q: "어디서 써요?"
    a: "음악 이퀄라이저, 음성 인식, 이미지 압축이요. 컴퓨터에선 FFT로 빠르게 계산해요."
    link: /studies/linear-algebra/dft/
    link_label: "이산 푸리에 변환과 FFT"
- q: "평균값 정리요?"
  a: "고속도로 두 톨게이트 사이 평균 속도가 시속 100 km면, 중간 어딘가에서 한 번은 정확히 시속 100 km로 달렸다는 거예요."
  link: /studies/calculus/mean-value-theorem/
  link_label: "평균값 정리"
  next:
  - q: "조건이 있어요?"
    a: "구간에서 끊기지 않고(연속), 안쪽에서 매끄러워야(미분 가능) 해요. 뾰족한 곳이 있으면 깨질 수 있어요."
- q: "극한이 어려워요"
  a: "어떤 값에 가까이 갈 때 함숫값이 어디로 다가가느냐예요. 그 점에서 값이 없어도 극한은 있을 수 있어요."
  link: /studies/calculus/limits/
  link_label: 극한
  next:
  - q: "로피탈 정리는요?"
    a: "0/0이나 ∞/∞ 꼴이면 위아래를 각각 미분해서 다시 봐요. 꼴을 확인하지 않고 쓰면 틀려요."
    link: /studies/calculus/lhopital-growth/
    link_label: "로피탈 정리와 증가 속도"
  - q: "e는 어디서 나와요?"
    a: "(1 + 1/n)ⁿ에서 n을 끝없이 키우면 2.718…로 다가가요. 이자를 아주 잘게 쪼개 붙이는 상황이랑 같아요."
    link: /studies/calculus/sequence-limits/
    link_label: "수열의 극한과 e"
- q: "라그랑주 승수법은 뭐예요?"
  a: "조건이 걸려 있을 때 최대·최소를 찾아요. 등고선이 조건 곡선에 딱 접하는 곳을 찾는 거예요."
  link: /studies/calculus/lagrange-multipliers/
  link_label: "라그랑주 승수법"
- q: "적분은 어떻게 계산해요?"
  a: "넓이를 얇은 막대로 잘라 더하는 게 리만 합이에요. 막대를 끝없이 얇게 하면 적분이 돼요. 이 페이지 배경 막대가 그 모습이에요."
  link: /studies/calculus/riemann-integral/
  link_label: "정적분과 리만 합"
  next:
  - q: "계산 기술은요?"
    a: "치환적분이랑 부분적분이 두 기둥이에요. 치환은 연쇄 법칙을, 부분적분은 곱의 미분을 거꾸로 쓴 거예요."
    link: /studies/calculus/integration-by-parts/
    link_label: 부분적분
talk:
- text: "극한값이 그 점의 함숫값이랑 꼭 같진 않아요. 둘이 같을 때를 따로 '연속'이라고 불러요."
  link: /studies/calculus/limits/
  link_label: 극한
- text: "연속이라고 다 미분되는 건 아니에요. |x|는 0에서 꺾여 있어서 미분이 안 돼요. ReLU도 그래요."
  link: /studies/calculus/derivative/
  link_label: 도함수
- text: "(fg)′는 f′g′가 아니에요. 직사각형 가로랑 세로가 각각 늘어난 걸 더해서 f′g + fg′예요."
  link: /studies/calculus/differentiation-rules/
  link_label: "미분 법칙"
- text: "합성함수 미분에서 안쪽 도함수 곱하는 걸 많이들 까먹어요. f′(g(x)) · g′(x)예요."
  link: /studies/calculus/chain-rule/
  link_label: "연쇄 법칙"
- text: "도함수가 0이라고 다 극값은 아니에요. x³은 0에서 기울기가 0인데 계속 올라가요."
  link: /studies/calculus/curve-analysis/
  link_label: "도함수의 활용과 최적화"
- text: "정적분이 넓이랑 늘 같진 않아요. sin x를 0부터 2π까지 적분하면 0인데 넓이는 4예요."
  link: /studies/calculus/riemann-integral/
  link_label: "정적분과 리만 합"
- text: "테일러 급수는 항을 늘린다고 어디서나 정확해지진 않아요. ln(1 + x)는 x = 2에서 오히려 크게 흔들려요."
  link: /studies/calculus/taylor-series/
  link_label: "테일러 급수"
- text: "학습률을 키운다고 늘 빨라지진 않아요. x²에서 0.5는 한 번에 끝나는데 1.1은 튕겨 나가요."
  link: /studies/calculus/gradient-descent/
  link_label: "경사 하강법"
- text: "기울기가 0이 돼서 멈췄다고 최솟값이 아닐 수 있어요. 안장점일 수도 있거든요."
  link: /studies/calculus/gradient-descent/
  link_label: "경사 하강법"
- text: "이웃한 항 차이가 0으로 가도 수렴 안 할 수 있어요. 1 + 1/2 + 1/3 + …은 끝없이 커져요."
  link: /studies/calculus/sequence-limits/
  link_label: "수열의 극한과 e"
- text: "부분적분은 곱의 미분 법칙을 거꾸로 쓴 거예요. 치환적분은 연쇄 법칙을 거꾸로 쓴 거고요."
  link: /studies/calculus/integration-by-parts/
  link_label: 부분적분
- text: "합은 적분으로 어림할 수 있어요. 1부터 n까지 1/k를 더하면 대략 ln n이에요."
  link: /studies/calculus/sum-integral-bounds/
  link_label: "합 ↔ 적분"
- text: "오일러 방법은 미분방정식을 짧은 직선으로 이어 붙여 푸는 거예요. 간격이 작을수록 정확해요."
  link: /studies/calculus/ode-euler/
  link_label: "미분방정식과 오일러 방법"
- text: "헤세 행렬은 2차 미분을 모은 행렬이에요. 극값이 최대인지 최소인지 안장점인지 알려 줘요."
  link: /studies/calculus/hessian/
  link_label: "헤세 행렬과 극값 판정"
