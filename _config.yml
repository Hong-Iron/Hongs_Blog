# ---------------------------------------------------------------------------
# Site configuration
# ---------------------------------------------------------------------------
title: "Hong-Iron"
tagline: "Projects, writings, and studies."
description: >-
  프로젝트, 지식 DB, 나의 팡세를 한곳에 모읍니다.
author: "Hong-Iron"
lang: ko
email: "hongcheolmin004@gmail.com"

# GitHub Pages project-site URL. Repo is "Hongs_Blog" (not "<user>.github.io"),
# so the site is served under a /Hongs_Blog path — baseurl must match.
url: "https://hong-iron.github.io"
baseurl: "/Hongs_Blog"

github_username: Hong-Iron

# Search engines. Paste the code each console gives for the "HTML tag"
# verification method (only the content="…" value).
#   Google: search.google.com/search-console → URL-prefix property
#           https://hong-iron.github.io/Hongs_Blog/
#   Naver:  searchadvisor.naver.com → 웹마스터 도구 → 사이트 등록
# Then submit https://hong-iron.github.io/Hongs_Blog/sitemap.xml in both.
webmaster_verifications:
  google:
naver_site_verification:

# Without this, Jekyll renders dates/permalinks using the build server's
# local timezone (UTC on GitHub's runners), not the "+0900" offset already
# in each post's front matter — a post timestamped 03:26 KST would get
# built as if it were the previous UTC day (02:26 -> Nov 8 instead of Nov 9).
timezone: Asia/Seoul

# ---------------------------------------------------------------------------
# Build
# ---------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
  # Posts are written in Obsidian, where a single newline is a line break.
  hard_wrap: true
  syntax_highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/

collections:
  projects:
    output: true
    permalink: /projects/:slug/
  # Study notes exported from the Obsidian vault by scripts/vault_export.py.
  # Each file sets its own permalink under /studies/.
  notes:
    output: true

defaults:
  # Link previews (og:image, via jekyll-seo-tag). The site card is the
  # fallback; each course's notes use that course's card; posts and projects
  # with a picture set their own `image:`. Cards: scripts/og_cards.py.
  - scope:
      path: ""
    values:
      image: /assets/img/og/site.png
  - scope:
      path: "_notes/abnormal-psychology"
    values:
      image: /assets/img/og/abnormal-psychology.png
  - scope:
      path: "_notes/algorithms"
    values:
      image: /assets/img/og/algorithms.png
  - scope:
      path: "_notes/operating-systems"
    values:
      image: /assets/img/og/operating-systems.png
  - scope:
      path: "_notes/signals-and-systems"
    values:
      image: /assets/img/og/signals-and-systems.png
  - scope:
      path: "_notes/numerical-analysis"
    values:
      image: /assets/img/og/numerical-analysis.png
  - scope:
      path: "_notes/data-science"
    values:
      image: /assets/img/og/data-science.png
  - scope:
      path: "_notes/calculus"
    values:
      image: /assets/img/og/calculus.png
  - scope:
      path: "_notes/college-math"
    values:
      image: /assets/img/og/college-math.png
  - scope:
      path: "_notes/computer-communication"
    values:
      image: /assets/img/og/computer-communication.png
  - scope:
      path: "_notes/discrete-math"
    values:
      image: /assets/img/og/discrete-math.png
  - scope:
      path: "_notes/human-interface-media"
    values:
      image: /assets/img/og/human-interface-media.png
  - scope:
      path: "_notes/linear-algebra"
    values:
      image: /assets/img/og/linear-algebra.png
  - scope:
      path: "_notes/probability-statistics"
    values:
      image: /assets/img/og/probability-statistics.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      lang: en   # project write-ups are in English
  - scope:
      path: ""
      type: notes
    values:
      layout: note
      excerpt_separator: ""   # notes are wrapped in {% raw %}; excerpts would split it

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Files/dirs Jekyll should not copy into the published _site.
# Keep design references and the management tooling out of the live site.
exclude:
  - _data/robot/README.md
  - "Templates and references"
  - scripts
  - README.md
  - MANAGING.md
  - pensees.pdf
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - CLAUDE.md
